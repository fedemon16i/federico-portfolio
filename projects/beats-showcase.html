<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>All Beats — Showcase</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090b;
  --surface:#111113;
  --border:rgba(255,255,255,.07);
  --text:#f2f0ec;
  --muted:#8a8580;
  --dim:#5c5854;
  --radius:12px;
  --fn:'DM Sans',system-ui,sans-serif;
  --fm:'DM Mono',ui-monospace,monospace;
  --fd:'Space Grotesk',system-ui,sans-serif;
  --ease:cubic-bezier(.65,0,.35,1);
  /* Per-project accent — overridden on panels */
  --accent:#888;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--fn)}

/* ── Skip link ───────────────────────────────────────── */
.skip-link{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.skip-link:focus{left:8px;top:8px;width:auto;height:auto;padding:8px 12px;background:#000;color:#fff;z-index:999}

/* ── Header ─────────────────────────────────────────── */
.hd{padding:32px 32px 0;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.hd-left h1{font-family:var(--fd);font-size:1.25rem;font-weight:700;color:var(--text);letter-spacing:-.02em;line-height:1.2}
.hd-left p{font-family:var(--fm);font-size:10px;color:var(--dim);margin-top:3px;text-transform:uppercase;letter-spacing:.1em}
.hd-hint{font-family:var(--fm);font-size:10px;color:var(--dim);white-space:nowrap}
@media(max-width:600px){.hd{padding:20px 16px 0}.hd-hint{display:none}}

/* ── Project tabs ─────────────────────────────────────── */
.tab-row{
  display:flex;gap:6px;padding:20px 32px 0;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.tab-row::-webkit-scrollbar{display:none}
@media(max-width:600px){.tab-row{padding:16px 16px 0}}
.tab{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 14px;border-radius:100px;
  border:1px solid var(--border);background:transparent;
  font-family:var(--fm);font-size:11px;color:var(--muted);
  cursor:pointer;white-space:nowrap;transition:border-color .2s,color .2s,background .2s;
  flex:0 0 auto;
}
.tab .dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--tab-accent,#666);opacity:.45;
  transition:opacity .2s;flex-shrink:0;
}
.tab.on{color:var(--text);border-color:color-mix(in srgb,var(--tab-accent,#fff) 45%,transparent);background:color-mix(in srgb,var(--tab-accent,#fff) 6%,transparent)}
.tab.on .dot{opacity:1}
.tab:hover:not(.on){color:var(--text)}

/* ── Panels container ─────────────────────────────────── */
#panels{position:relative;padding:0}

/* ── Panel (grid wrapper) ─────────────────────────────── */
.panel{
  display:none;
  padding:24px 32px 56px;
  grid-template-columns:minmax(0,300px) 1fr;
  gap:40px;
  align-items:start;
}
.panel.on{display:grid}
@media(max-width:900px){.panel.on{grid-template-columns:1fr;gap:24px}}
@media(max-width:600px){.panel{padding:16px 16px 48px}}

/* ── Info column ─────────────────────────────────────── */
.info{display:flex;flex-direction:column;gap:18px;position:sticky;top:20px}
@media(max-width:900px){.info{position:static}}

.beat-eyebrow{font-family:var(--fm);font-size:10px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.beat-title{font-family:var(--fd);font-size:clamp(1.6rem,1rem + 2vw,2.3rem);font-weight:700;letter-spacing:-.03em;line-height:1.08;color:var(--text)}
.beat-desc{font-size:.9375rem;line-height:1.68;color:var(--muted);max-width:32ch}

/* transition */
.info.t .beat-eyebrow,.info.t .beat-title,.info.t .beat-desc{opacity:0;transition:opacity .1s}
.beat-eyebrow,.beat-title,.beat-desc{transition:opacity .22s .05s}

/* Beat pills ─────────────────────────────────────────── */
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 11px;border-radius:100px;
  border:1px solid var(--border);background:transparent;
  font-family:var(--fm);font-size:10.5px;color:var(--muted);
  cursor:pointer;transition:border-color .2s,color .2s,background .2s;
}
.pill .pn{color:var(--dim);font-size:9.5px;font-variant-numeric:tabular-nums}
.pill.on{
  color:var(--text);
  border-color:color-mix(in srgb,var(--accent,#fff) 55%,transparent);
  background:color-mix(in srgb,var(--accent,#fff) 9%,transparent);
}
.pill.on .pn{color:color-mix(in srgb,var(--accent,#fff) 65%,transparent)}
.pill:hover:not(.on){color:var(--text);border-color:rgba(255,255,255,.15)}

/* Divider + meta ─────────────────────────────────────── */
.info-footer{display:flex;align-items:center;gap:8px;padding-top:4px;border-top:1px solid var(--border)}
.proj-name{font-family:var(--fm);font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;gap:6px}
.proj-name::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}

/* ── Animation frame ─────────────────────────────────── */
.frame{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  /* 16:10 at comfortable size */
  aspect-ratio:16/10;
  min-height:340px;
}
@media(max-width:600px){.frame{min-height:260px}}
.frame iframe{
  position:absolute;inset:0;width:100%;height:100%;
  border:none;display:block;
}

/* Loading shimmer */
.loader{
  position:absolute;inset:0;z-index:5;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface);
  transition:opacity .5s;
}
.loader.gone{opacity:0;pointer-events:none}
.ld{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent,#666);opacity:.35;
  animation:ldpulse 1.4s ease-in-out infinite;
}
@keyframes ldpulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.8;transform:scale(1.35)}}

/* prefers-reduced-motion */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div class="hd">
  <div class="hd-left">
    <h1>All Beats</h1>
    <p>Internal showcase — animation library</p>
  </div>
  <div class="hd-hint">← → or [ ] to navigate</div>
</div>

<div class="tab-row" role="tablist" aria-label="Projects" id="tabRow"></div>

<div id="panels" id="main"></div>

<script>
var PROJECTS = [
  {
    id:'ey', name:'EY Fabric', accent:'#c9a227',
    src:'ey-pi-player.html',
    beats:[
      {n:'01',name:'Measure',   desc:'Analytics snapshot across EY Fabric catalog listings — traffic, engagement, conversion at a glance.'},
      {n:'02',name:'Analyze',   desc:'Funnel analysis revealing where users drop across search, detail, and apply flows.'},
      {n:'03',name:'Research',  desc:'User research synthesis mapped to catalog friction points and unmet needs.'},
      {n:'04',name:'Understand',desc:'Persona map — who uses the catalog, what they need, and what blocks them.'},
      {n:'05',name:'Design',    desc:'Redesigned catalog search and product detail flow — clarity-first information architecture.'},
      {n:'06',name:'Hub',       desc:'Central hub connecting all catalog interactions — a single control surface.'},
      {n:'07',name:'User flow', desc:'Guided onboarding: Pendo tooltip → pre-checklist gate → step-by-step form with live cost.'},
      {n:'08',name:'Publisher', desc:'Publisher dashboard — add onboarding guides, define checklists, review submissions.'},
      {n:'09',name:'Improved',  desc:'Before vs after — same form, guided entry, inline context, cost before commit.'},
    ]
  },
  {
    id:'skills', name:'Skills', accent:'#d97757',
    src:'skills-player.html',
    beats:[
      {n:'01',name:'Mapping',   desc:'Skills taxonomy mapped across roles, seniority, and org units.'},
      {n:'02',name:'Usage',     desc:'Which skills are actually used — frequency and recency data surfaced.'},
      {n:'03',name:'Segment',   desc:'Cohort segmentation — clusters of skill patterns by team and level.'},
      {n:'04',name:'Research',  desc:'Research synthesis: where skills gap is felt most acutely by managers and ICs.'},
      {n:'05',name:'Understand',desc:'Mental models — how people think about skill growth and gap identification.'},
      {n:'06',name:'Design',    desc:'Redesigned skill profile and endorsement flow — mutual recognition built in.'},
      {n:'07',name:'Hub',       desc:'Skill hub: personal profile, team view, and org-wide leaderboard in one surface.'},
      {n:'08',name:'Systems',   desc:'Systems view — skill health across the whole org, filterable by domain.'},
    ]
  },
  {
    id:'dc', name:'DollarCity', accent:'#00a650',
    src:'dollarcity-player.html',
    beats:[
      {n:'01',name:'Why',      desc:'Reviewers juggling tabs to watch footage and search products — everything moves to one screen.'},
      {n:'02',name:'Search',   desc:'Flagged transactions surface first — score, exceptions, and a one-click path to footage.'},
      {n:'03',name:'States',   desc:'Every request shows its state up front — queued, downloading, ready — no more wondering.'},
      {n:'04',name:'Review',   desc:'Footage and receipt line up frame-by-frame — classify without leaving the video.'},
      {n:'05',name:'Expand',   desc:'One click expands footage full-frame — the receipt stays one tab away.'},
      {n:'06',name:'Requests', desc:'Every clip a reviewer pulled lives in one place — searchable, filterable, deletable in bulk.'},
      {n:'07',name:'New',      desc:'Requesting footage is one modal — camera, time range, and quality, nothing hidden.'},
      {n:'08',name:'Queue',    desc:'Downloads process in the background — reviewers keep working instead of watching a spinner.'},
      {n:'09',name:'Filters',  desc:'Filters and image-first product search replace memorized SKU lookups.'},
    ]
  },
  {
    id:'bc', name:'Blockchain 3D', accent:'#22d4c8',
    src:'blockchain-player.html',
    beats:[
      {n:'01',name:'Onboard',desc:'Welcome to your 3D map — content lives on places you own in space.'},
      {n:'02',name:'Place',  desc:'Enter the map, long-press the street, confirm the address, style your pin.'},
      {n:'03',name:'Media',  desc:'Empty feed → choose source → device gallery → upload and publish.'},
      {n:'04',name:'Visitor',desc:'Find MY POI on the map — tap the pin, scroll reels, play full-screen.'},
    ]
  },
  {
    id:'chek', name:'Chek', accent:'#7a3be0',
    src:'chek-player.html',
    beats:[
      {n:'01',name:'Hub',     desc:'Credit card hub — balance, limit, quick actions, and recent moves at a glance.'},
      {n:'02',name:'Pay',     desc:'Pay card flow — amount input, date picker, confirmation, all in one modal.'},
      {n:'03',name:'Limit',   desc:'Credit limit and balance breakdown — available, used, cash advance in one view.'},
      {n:'04',name:'Moves',   desc:'Movements and statements — filterable transaction history with statement export.'},
      {n:'05',name:'Security',desc:'Security help — card block and unblock, PIN change, fraud report flow.'},
      {n:'06',name:'Onboard', desc:'Onboarding — step-by-step first-time setup for a new credit card activation.'},
    ]
  }
];

/* ── State ──────────────────────────────────────────── */
var state = {proj:0, beat:0};
var iframes = {}; // id → <iframe>
var loaders = {}; // id → <div.loader>

/* ── Build DOM ─────────────────────────────────────── */
var tabRow  = document.getElementById('tabRow');
var panelsEl= document.getElementById('panels');

PROJECTS.forEach(function(proj, pi){
  /* Tab -------------------------------------------- */
  var tab = document.createElement('button');
  tab.className = 'tab' + (pi===0?' on':'');
  tab.setAttribute('role','tab');
  tab.setAttribute('aria-selected', pi===0?'true':'false');
  tab.setAttribute('aria-controls','panel-'+proj.id);
  tab.style.setProperty('--tab-accent', proj.accent);
  tab.innerHTML = '<span class="dot"></span>' + proj.name;
  tab.addEventListener('click', function(){ activateProject(pi); });
  tabRow.appendChild(tab);

  /* Panel ------------------------------------------ */
  var panel = document.createElement('div');
  panel.className = 'panel' + (pi===0?' on':'');
  panel.id = 'panel-'+proj.id;
  panel.setAttribute('role','tabpanel');
  panel.style.setProperty('--accent', proj.accent);

  /* Info column */
  var info = document.createElement('div');
  info.className = 'info';
  info.id = 'info-'+proj.id;

  var eyebrow = document.createElement('div');
  eyebrow.className = 'beat-eyebrow';
  eyebrow.id = 'ey-'+proj.id;

  var btitle = document.createElement('h2');
  btitle.className = 'beat-title';
  btitle.id = 'bt-'+proj.id;

  var bdesc = document.createElement('p');
  bdesc.className = 'beat-desc';
  bdesc.id = 'bd-'+proj.id;

  var pills = document.createElement('div');
  pills.className = 'pills';
  pills.id = 'pills-'+proj.id;

  proj.beats.forEach(function(beat, bi){
    var pill = document.createElement('button');
    pill.className = 'pill' + (bi===0&&pi===0?' on':'');
    pill.innerHTML = '<span class="pn">'+beat.n+'</span>'+beat.name;
    pill.addEventListener('click', function(){
      if(state.proj !== pi){ activateProject(pi, function(){ activateBeat(pi, bi); }); }
      else activateBeat(pi, bi);
    });
    pills.appendChild(pill);
  });

  var footer = document.createElement('div');
  footer.className = 'info-footer';
  var pname = document.createElement('div');
  pname.className = 'proj-name';
  pname.textContent = proj.name;
  footer.appendChild(pname);

  info.appendChild(eyebrow);
  info.appendChild(btitle);
  info.appendChild(bdesc);
  info.appendChild(pills);
  info.appendChild(footer);

  /* Frame column */
  var frame = document.createElement('div');
  frame.className = 'frame';

  var loader = document.createElement('div');
  loader.className = 'loader';
  loader.innerHTML = '<div class="ld"></div>';
  loaders[proj.id] = loader;

  var iframe = document.createElement('iframe');
  iframe.src = proj.src + '?embed=1';
  iframe.title = proj.name + ' player';
  iframe.loading = 'lazy';
  iframes[proj.id] = iframe;

  iframe.addEventListener('load', function(){
    loaders[proj.id].classList.add('gone');
    injectHideStyle(iframe);
  });

  frame.appendChild(loader);
  frame.appendChild(iframe);
  panel.appendChild(info);
  panel.appendChild(frame);
  panelsEl.appendChild(panel);

  /* Seed first beat text */
  if(pi===0) fillInfo(0, 0, false);
});

/* ── Helpers ──────────────────────────────────────── */
function injectHideStyle(iframe){
  /* Hide the player's own title/text phase — we show that in the parent */
  try{
    var doc = iframe.contentDocument;
    if(!doc) return;
    var s = doc.createElement('style');
    /* Selectors that exist across the different player templates */
    s.textContent = [
      '#textPhase','.text-phase','.text-col',
      '.eyebrow:not(.cs-badge)',
      'h1.hd-title','body > .wrap > h1',
      '.lede','.note'
    ].join(',') + '{display:none!important}';
    doc.head.appendChild(s);
  }catch(e){}
}

function fillInfo(pi, bi, animate){
  var proj = PROJECTS[pi];
  var beat = proj.beats[bi];
  var info = document.getElementById('info-'+proj.id);

  function apply(){
    document.getElementById('ey-'+proj.id).textContent = 'Beat '+beat.n;
    document.getElementById('bt-'+proj.id).textContent = beat.name;
    document.getElementById('bd-'+proj.id).textContent = beat.desc;
    var ps = document.getElementById('pills-'+proj.id).querySelectorAll('.pill');
    ps.forEach(function(p,i){ p.classList.toggle('on', i===bi); });
  }

  if(animate){
    info.classList.add('t');
    setTimeout(function(){ apply(); info.classList.remove('t'); }, 110);
  } else {
    apply();
  }
}

function sendBeat(pi, bi){
  var iframe = iframes[PROJECTS[pi].id];
  if(!iframe || !iframe.contentWindow) return;
  iframe.contentWindow.postMessage({type:'playBeat', index:bi}, '*');
}

/* ── Project / beat activation ───────────────────── */
function activateProject(pi, cb){
  if(pi === state.proj){ if(cb) cb(); return; }
  var prev = state.proj;
  state.proj = pi;
  state.beat = 0;

  /* Tabs */
  tabRow.querySelectorAll('.tab').forEach(function(t,i){
    t.classList.toggle('on', i===pi);
    t.setAttribute('aria-selected', i===pi?'true':'false');
  });

  /* Panels */
  document.getElementById('panel-'+PROJECTS[prev].id).classList.remove('on');
  document.getElementById('panel-'+PROJECTS[pi].id).classList.add('on');

  fillInfo(pi, 0, false);
  if(cb) cb();
}

function activateBeat(pi, bi){
  state.beat = bi;
  fillInfo(pi, bi, true);
  sendBeat(pi, bi);
}

/* ── Init ─────────────────────────────────────────── */
window.addEventListener('load', function(){
  setTimeout(function(){ sendBeat(0, 0); }, 500);
});

/* Keyboard nav */
document.addEventListener('keydown', function(e){
  if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT') return;
  var proj = PROJECTS[state.proj];
  var bi = state.beat;
  if(e.key==='ArrowRight'||e.key===']'){
    e.preventDefault();
    var n = Math.min(bi+1, proj.beats.length-1);
    if(n!==bi) activateBeat(state.proj, n);
  } else if(e.key==='ArrowLeft'||e.key==='['){
    e.preventDefault();
    var p = Math.max(bi-1, 0);
    if(p!==bi) activateBeat(state.proj, p);
  } else if(e.key==='Tab'&&!e.shiftKey&&e.altKey){
    e.preventDefault();
    activateProject((state.proj+1)%PROJECTS.length);
  }
});
</script>
</body>
</html>
