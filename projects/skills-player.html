<style>
:root{
  --bg:#0e0d0c; --bg-surface:#171614; --bg-raised:#1e1c1a;
  --text:#f2f0ec; --muted:#a6a29a; --faint:#918b81;

  --accent:#d97757; --accent-dim:rgba(217,119,87,.12); --on-accent:#2b1207;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
.page{padding:8px 10px 12px!important;max-width:920px;margin:0 auto;padding:14px 12px 36px}

.shell{display:grid;grid-template-columns:minmax(130px,170px) 1fr;gap:10px}
@media(max-width:720px){.shell{grid-template-columns:1fr}}
.tl{display:flex;flex-wrap:wrap;gap:4px}
.tl button{height:26px;padding:0 8px;border-radius:100px;border:1px solid var(--line);background:0;color:var(--muted);font-size:9.5px;cursor:pointer}
.tl button.on{background:var(--accent);color:var(--on-accent);font-weight:700;border-color:var(--accent)}
.controls{display:flex;gap:5px;align-items:center;margin-top:7px;flex-wrap:wrap}
.controls button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:0;color:rgba(255,255,255,.55);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.controls button:disabled{opacity:.35}
.prog{flex:1;min-width:36px;height:3px;background:#2a2826;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s var(--ease)}
.beat-lab{font-size:10px;color:var(--faint);width:100%;margin-top:3px}
.frame{width:100%;height:min(480px,66vh);min-height:300px;display:flex;align-items:center;justify-content:center}
.unit{width:var(--dw);height:var(--dh);position:relative;flex-shrink:0;transform-origin:center center;border-radius:14px;overflow:hidden;background:linear-gradient(rgba(217,119,87,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(217,119,87,.07) 1px,transparent 1px),#161412;background-size:22px 22px;border:1.5px solid rgba(217,119,87,.38);box-shadow:0 0 0 1px rgba(217,119,87,.1),inset 0 0 40px rgba(217,119,87,.04)}
.win{position:absolute;top:var(--pad-top);left:var(--pad-x);right:var(--pad-x);bottom:var(--cap);overflow:hidden;border-radius:8px}
.cap{position:absolute;left:0;right:0;bottom:0;min-height:var(--cap);padding:20px 16px 11px;text-align:center;font-size:13px;line-height:1.35;pointer-events:none;z-index:30;font-weight:500;letter-spacing:-.01em;
  background:linear-gradient(to top,rgba(14,13,12,.97) 0%,rgba(14,13,12,.88) 52%,transparent 100%);opacity:0;transition:opacity .4s var(--ease)}

.cursor{position:absolute;z-index:50;pointer-events:none;opacity:0;width:18px;height:18px;margin:0;
  transition:left 1.1s var(--spring),top 1.1s var(--spring),opacity .2s,transform .14s var(--spring);filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.cursor svg{display:block;width:18px;height:18px}
.cursor.show{opacity:1} .cursor.click{transform:translate(1px,2px) scale(.9)}

.onb-mock{position:absolute;inset:6px;background:var(--bg);border-radius:7px;border:1px solid rgba(143,212,168,.3);display:none;flex-direction:column;z-index:6;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.5);overflow:hidden;align-items:center;text-align:center}

.onb-mock .ck{width:100%;max-width:220px;text-align:left}
.onb-mock .ck label{display:flex;align-items:center;gap:6px;padding:5px 6px;margin-bottom:3px;border-radius:5px;background:rgba(255,255,255,.04);border:1px solid var(--line-soft);font-size:9.5px;color:rgba(255,255,255,.6);opacity:0;transform:translateY(3px);transition:opacity .3s,transform .3s var(--spring),border-color .3s}
.onb-mock .ck label.on{opacity:1;transform:none} .onb-mock .ck label.done{border-color:rgba(143,212,168,.4);background:rgba(143,212,168,.08)}
.onb-mock .ck label i{width:12px;height:12px;border-radius:3px;border:1.5px solid rgba(255,255,255,.2);flex-shrink:0}
.onb-mock .ck label.done i{border-color:var(--ok);background:rgba(143,212,168,.25)}
.onb-mock .cta{margin-top:6px;padding:5px 12px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;opacity:0;transition:opacity .35s}
.onb-mock .cta.on{opacity:1}
.deploy-opt{margin-top:4px;font-size:8px;color:rgba(255,255,255,.4);opacity:0;transition:opacity .4s} .deploy-opt.on{opacity:1}
.deploy-opt code{font-family:var(--mono);color:var(--ok)}
.hub{height:100%;display:grid;grid-template-columns:96px 1fr;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.hub-side{background:var(--bg-surface);border-right:1px solid var(--line-soft);padding:8px 5px;font-size:9px;color:rgba(255,255,255,.4)}
.hub-brand{display:flex;align-items:center;gap:5px;color:#f2f0ec;font-weight:700;margin-bottom:7px;padding:0 2px;font-size:9.5px}
.hub-brand i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.hub-side a{display:block;padding:4px 5px;border-radius:4px;margin-bottom:2px;color:inherit;text-decoration:none}
.hub-side a.on{background:var(--accent-dim);color:var(--accent);font-weight:600}
.hub-main{padding:9px;display:flex;flex-direction:column;gap:5px}
.hub-search{height:22px;border-radius:5px;border:1px solid var(--line);background:rgba(0,0,0,.25);display:flex;align-items:center;padding:0 7px;font-size:9px;color:rgba(255,255,255,.35)}
.hub-search em{color:var(--accent);font-style:normal}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.metric{background:var(--bg-surface);border:1px solid var(--line);border-radius:6px;padding:7px;opacity:0;transform:translateY(5px);transition:opacity .35s,transform .35s var(--spring)}
.metric.on{opacity:1;transform:none} .metric .l{font-size:8.5px;color:rgba(255,255,255,.4)} .metric .v{font-size:13px;font-weight:700;color:var(--accent);margin-top:1px}
.sig{display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:5px;background:rgba(255,255,255,.03);border:1px solid var(--line-soft);font-size:9px;color:rgba(255,255,255,.5);opacity:0;transition:opacity .35s}
.sig.on{opacity:1} .sig.hot{background:rgba(224,133,127,.1);border-color:rgba(224,133,127,.3);color:#ffb4a8}
.sig .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)} .sig.hot .dot{background:var(--bad);box-shadow:0 0 0 2px rgba(224,133,127,.2)}
.sig .val{margin-left:auto;font-weight:700}
.note{font-size:11px;color:var(--muted);margin-top:8px}

.wchrome{flex:0 0 28px;display:flex;align-items:center;gap:6px;padding:0 10px;background:linear-gradient(180deg,#2c2826,#1e1c1a);border-bottom:1px solid rgba(217,119,87,.22);font-size:10px;color:rgba(255,255,255,.4)}

.app,.shop{border:1px solid rgba(217,119,87,.25)!important;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.cat-card,.user-row,.metric,.sig,.prob,.task,.sm-node,.feat-row,.ev-row{transition:opacity .45s,transform .55s var(--spring),border-color .25s,background .25s!important}


/* Figma-style click pulse */
.cursor-pulse{
  position:absolute;z-index:39;pointer-events:none;
  width:10px;height:10px;margin-left:-5px;margin-top:-5px;
  border-radius:50%;border:2px solid rgba(255,255,255,.85);
  opacity:0;transform:scale(.4);
}
.cursor-pulse.fire{
  animation:figmaPulse .45s cubic-bezier(.22,.8,.36,1) forwards;
}
@keyframes figmaPulse{
  0%{opacity:.9;transform:scale(.35);border-width:2px}
  70%{opacity:.35;transform:scale(2.4);border-width:1px}
  100%{opacity:0;transform:scale(3);border-width:0}
}
.cursor.click{transform:scale(.82);transition:transform .1s ease-out}
.tool.show{opacity:1}


/* iOS Safari touch fixes */
.tl button, .controls button, .stage-arrow {
  touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(255,255,255,.12);
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.controls button { min-width: 44px; min-height: 44px; }
.tl button { min-height: 36px; padding: 0 12px; }


/* === MOBILE + SCALE RULES (no page scroll, full UI visible) === */
html, body {
  overflow-x: hidden !important;
  max-width: 100vw !important;
}
.page, .shell, .frame {
  max-width: 100% !important;
  min-width: 0 !important;
  box-sizing: border-box !important;
}
.frame {
  overflow: hidden !important;
  width: 100% !important;
}
.unit {
  /* fixed artboard — never grow page; only transform:scale via fit() */
  flex-shrink: 0 !important;
}
/* compact timeline on narrow */
@media (max-width: 720px) {
  .shell {
    grid-template-columns: 1fr !important;
    gap: 8px !important;
  }
  .tl {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 4px !important;
    max-height: none !important;
    overflow: visible !important;
  }
  .tl button {
    font-size: 10px !important;
    padding: 4px 8px !important;
    min-height: 28px !important;
  }
  .controls {
    gap: 6px !important;
  }
  .controls button {
    min-width: 36px !important;
    min-height: 36px !important;
  }
  .frame {
    height: min(52vh, 380px) !important;
    min-height: 240px !important;
  }
  /* embed: even tighter so modal fits without host scroll */
  html.embed .frame {
    height: min(48vh, 340px) !important;
    min-height: 220px !important;
  }
  html.embed .page {
    padding: 4px !important;
  }
  html.embed, html.embed body {
    overflow: hidden !important;
    height: 100% !important;
  }
}
/* prevent any inner mock from forcing horizontal scroll */
.fab, .wchrome, .meas, .des, .wb, .fab-cat, .paths, .hub-app, .rw-grid {
  max-width: 100% !important;
  min-width: 0 !important;
  box-sizing: border-box !important;
}
.meas-l, .meas-r, .des-col, .wb-form, .wb-sum, .fab-side, .fab-main {
  min-width: 0 !important;
  overflow: hidden !important;
}


/* ── Light mode ── */
html[data-theme="light"] {
  --bg: #f7f5f2;
  --bg-surface: #ffffff;
  --bg-raised: #eeece7;
  --text: #1a1917;
  --muted: #55524c;
  --faint: #726e66;
  --line: rgba(0,0,0,.1);
  --line-soft: rgba(0,0,0,.06);
  --accent: #c45d3a;
  --accent-dim: rgba(196,93,58,.12);
  --on-accent: #fff;
  --ok: #2a9a5c;
  --warn: #b8860b;
  --bad: #c44;
}
html[data-theme="light"], html[data-theme="light"] body {
  background: var(--bg);
  color: var(--text);
}
html[data-theme="light"] .tl button {
  background: var(--bg-surface);
  border-color: var(--line);
  color: var(--muted);
}
html[data-theme="light"] .tl button.on {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--text);
}
html[data-theme="light"] .controls button {
  background: var(--bg-surface);
  border-color: var(--line);
  color: var(--text);
}
html[data-theme="light"] .unit {
  background:
    linear-gradient(rgba(196,93,58,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(196,93,58,.08) 1px, transparent 1px),
    #e8e6e0 !important;
  background-size: 20px 20px, 20px 20px, auto !important;
  border-color: rgba(0,0,0,.1);
}
html[data-theme="light"] .cap {
  background: linear-gradient(to top, rgba(247,245,242,.98), rgba(247,245,242,.88), transparent) !important;
  color: var(--text);
}
html[data-theme="light"] .kicker,
html[data-theme="light"] .lead { color: var(--muted); }
html[data-theme="light"] h1 { color: var(--text); }
html[data-theme="light"] h1 em { color: var(--accent); }
html[data-theme="light"] .prog { background: rgba(0,0,0,.08); }
html[data-theme="light"] .prog i { background: var(--accent); }


/* side arrows on stage (same as EY PI) */
.stage-arrows{position:absolute;inset:0;pointer-events:none;z-index:30}
.stage-arrow{
  pointer-events:auto;position:absolute;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;
  border:1px solid rgba(255,255,255,.12);background:rgba(14,13,12,.55);
  color:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;backdrop-filter:blur(6px);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.stage-arrow:hover{border-color:var(--accent,#d97757);color:var(--accent,#d97757)}
.stage-arrow.prev{left:6px}
.stage-arrow.next{right:6px}
.stage-arrow:disabled{opacity:.25;pointer-events:none}
.stage-arrow svg{width:14px;height:14px}

  background:rgba(255,255,255,.85);border-color:rgba(0,0,0,.12);color:rgba(0,0,0,.55);
}


/* === CONTAIN UI inside window (skills parity) === */

}
.unit {

  height: var(--dh) !important;

    var n = m ? parseInt(m[1],10) : 0;
    if (isNaN(n) || n < 0) n = 0;
    if (n > 6) n = 6;
    setTimeout(function(){
      if (typeof window.playBeat === 'function') window.playBeat(n);
      else if (typeof go === 'function') go(n);
    }, 129);
  }
  window.addEventListener('message', function(e){
    if (!e.data) return;
    if (e.data.type === 'playBeat' && typeof window.playBeat === 'function') {
      window.playBeat(e.data.index|0);
    }
  });
  if (document.readyState === 'complete') startFromHash();
  else window.addEventListener('load', startFromHash);
})();
</script>




<script>
(function(){
  function fitStages(){
    var tl = document.getElementById('tl');
    if(!tl) return;
    // Always measure with full names visible
    tl.classList.remove('stages-compact');
    // Force layout
    void tl.offsetWidth;
    var rowTop = null, wraps = false;
    var btns = tl.querySelectorAll('button');
    if(!btns.length) return;
    for(var i=0;i<btns.length;i++){
      var r = btns[i].getBoundingClientRect();
      if(rowTop === null) rowTop = Math.round(r.top);
      else if(Math.abs(Math.round(r.top) - rowTop) > 2){ wraps = true; break; }
    }
    // Also if overflow width
    if(tl.scrollWidth > tl.clientWidth + 1) wraps = true;
    if(wraps) tl.classList.add('stages-compact');
  }
  window.addEventListener('resize', function(){
    clearTimeout(window.__fitStagesT);
    window.__fitStagesT = setTimeout(fitStages, 80);
  });
  function boot(){
    fitStages();
    setTimeout(fitStages, 86);
    setTimeout(fitStages, 331);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  // Close: postMessage to parent (modal host) or history.back
  var cx = document.getElementById('closeX');
  if(cx){
    cx.addEventListener('click', function(){
      try {
        if(window.parent && window.parent !== window){
          window.parent.postMessage({ type: 'skills-player-close' }, '*');
        }
      } catch(e) {}
      try { if(window.history.length > 1) history.back(); } catch(e) {}
    });
  }
})();
</script>




































































<script>
/* CLEAN fit v52 — width of text column; unit always fully visible */
(function(){
  var isEmbed = document.documentElement.classList.contains('embed')
    || /(?:^|[?&#])embed=1\b/.test(location.search+location.hash);
  if(!isEmbed) return;
  document.documentElement.classList.add('embed');

  var NW=560, NH=410, AIR=2;

  function fit(){
    var unit=document.getElementById('unit');
    var frame=document.getElementById('frame');
    var page=document.querySelector('.page');
    if(!unit||!frame) return;

    var fw=frame.getBoundingClientRect().width;
    if(fw<40) fw=(page&&page.clientWidth)||window.innerWidth;

    /* Primary: match text/column width */
    var s = (fw - AIR*2) / NW;
    if(s>1.12) s=1.12;
    if(s<0.32) s=0.32;

    var visW=NW*s, visH=NH*s;

    /* Slot exactly fits visual unit — no crop inside player */
    frame.style.height = Math.ceil(visH + 6) + 'px';
    frame.style.minHeight = Math.ceil(visH + 6) + 'px';
    frame.style.maxHeight = 'none';
    frame.style.overflow = 'visible';

    unit.style.left = ((fw - visW) / 2) + 'px';
    unit.style.top = '0';
    unit.style.width = NW + 'px';
    unit.style.height = NH + 'px';
    unit.style.transformOrigin = 'top left';
    unit.style.transform = 'scale(' + s + ')';
    unit.style.position = 'absolute';

    if(page){
      /* Height to bottom of scaled unit (not just page box which can lag) */
      var pageTop = page.getBoundingClientRect().top;
      var unitBottom = unit.getBoundingClientRect().bottom;
      var fromUnit = Math.ceil(unitBottom - pageTop + 20);
      var fromPage = Math.ceil(Math.max(page.scrollHeight||0, page.getBoundingClientRect().height)) + 12;
      var h = Math.max(fromUnit, fromPage);
      try{
        if(window.parent && window.parent !== window){
          window.parent.postMessage({type:'skills-player-height', height:h}, '*');
        }
      }catch(e){}
    }
  }

  window.fitUnit=fit;
  var _o=window.fit;
  window.fit=function(){
    if(document.documentElement.classList.contains('embed')) return fit();
    if(typeof _o==='function') return _o.apply(this,arguments);
  };

  function boot(){ fit(); [30,100,250,600,1200,2000].forEach(function(t){setTimeout(fit,t);}); }
  window.addEventListener('resize', function(){ clearTimeout(window.__c52); window.__c52=setTimeout(fit,40); });
  document.addEventListener('click', function(){ setTimeout(fit,60); }, true);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
