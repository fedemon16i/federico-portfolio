<title>EY · Product Intelligence</title>
<style>
:root{
  --bg:#0e0d0c; --bg-surface:#171614; --bg-raised:#1e1c1a;
  --text:#f2f0ec; --muted:#a6a29a; --faint:#918b81;
  --line:rgba(255,255,255,.08); --line-soft:rgba(255,255,255,.05);
  --accent:#c9a227; --accent-dim:rgba(201,162,39,.12); --on-accent:#1a1508;
  --ok:#8fd4a8; --warn:#e5b567; --bad:#e0857f;
  --u1:#7ba7f0; --u2:#e5b567; --u3:#8fd4a8; --pendo:#FF4A7D;
  --ease:cubic-bezier(.65,0,.35,1); --spring:cubic-bezier(.34,1.32,.64,1);
  --font:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --dw:560px; --dh:410px; --cap:54px; --pad-top:16px; --pad-x:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
.page{padding:8px 10px 12px!important;max-width:920px;margin:0 auto;padding:14px 12px 36px}
.kicker{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:19px;margin:5px 0;font-weight:700} h1 em{color:var(--accent);font-style:normal}
.lead{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.45;max-width:520px}
.shell{display:grid;grid-template-columns:minmax(130px,170px) 1fr;gap:10px}
@media(max-width:720px){.shell{grid-template-columns:1fr}}
.tl{display:flex;flex-wrap:wrap;gap:4px}
.tl button{height:26px;padding:0 8px;border-radius:100px;border:1px solid var(--line);background:0;color:var(--muted);font-size:9.5px;cursor:pointer}
.tl button.on{background:var(--accent);color:var(--on-accent);font-weight:700;border-color:var(--accent)}
.controls{display:flex;gap:5px;align-items:center;margin-top:7px;flex-wrap:wrap}
.controls button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:0;color:rgba(255,255,255,.55);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.controls button:disabled{opacity:.35}
.prog{flex:1;min-width:36px;height:3px;background:#2a2826;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s var(--ease)}
.beat-lab{font-size:10px;color:var(--faint);width:100%;margin-top:3px}
.frame{width:100%;height:min(480px,66vh);min-height:300px;display:flex;align-items:center;justify-content:center}
.unit{width:var(--dw);height:var(--dh);position:relative;flex-shrink:0;transform-origin:center center;border-radius:14px;overflow:hidden;background:linear-gradient(rgba(201,162,39,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(201,162,39,.07) 1px,transparent 1px),#161412;background-size:22px 22px;border:1.5px solid rgba(201,162,39,.38);box-shadow:0 0 0 1px rgba(201,162,39,.1),inset 0 0 40px rgba(201,162,39,.04)}
.win{position:absolute;top:var(--pad-top);left:var(--pad-x);right:var(--pad-x);bottom:var(--cap);overflow:hidden;border-radius:8px}
.cap{position:absolute;left:0;right:0;bottom:0;min-height:var(--cap);padding:20px 16px 11px;text-align:center;font-size:13px;line-height:1.35;pointer-events:none;z-index:30;font-weight:500;letter-spacing:-.01em;
  background:linear-gradient(to top,rgba(14,13,12,.97) 0%,rgba(14,13,12,.88) 52%,transparent 100%);opacity:0;transition:opacity .4s var(--ease)}
.cap.on{opacity:1} .cap em{color:var(--accent);font-style:normal;font-weight:650}
.cursor{position:absolute;z-index:50;pointer-events:none;opacity:0;width:18px;height:18px;margin:0;
  transition:left 1.1s var(--spring),top 1.1s var(--spring),opacity .2s,transform .14s var(--spring);filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.cursor svg{display:block;width:18px;height:18px}
.cursor.show{opacity:1} .cursor.click{transform:translate(1px,2px) scale(.9)}
.cursor.u2 svg path{fill:var(--u1)} .cursor.u3 svg path{fill:var(--u3)}
.utool{position:absolute;z-index:51;font-size:9px;font-weight:650;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.82);border:1px solid rgba(255,255,255,.15);color:#fff;
  pointer-events:none;opacity:0;transform:translate(14px,-8px);white-space:nowrap;transition:opacity .2s,left 1.1s var(--spring),top 1.1s var(--spring)}
.utool.show{opacity:1}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .5s var(--ease)}
.slide.on{opacity:1} .slide.text{align-items:center;justify-content:center;text-align:center;padding:18px 20px}
.ts-big{font-size:22px;font-weight:700;line-height:1.28;max-width:420px;letter-spacing:-.02em;color:rgba(255,255,255,.92)} .ts-big em{color:var(--accent);font-style:normal;font-weight:750;text-shadow:0 0 24px rgba(201,162,39,.35)}
.dock{display:flex;gap:5px;margin-top:11px;justify-content:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:100px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:10px;color:var(--muted)}
.logo-mark{width:12px;height:12px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:6px;font-weight:800;color:#fff}
.logo-pendo{background:#FF4A7D} .logo-ga{background:#F9AB00;color:#111} .logo-mix{background:#7856FF}
.logo-maze{background:#2A1E5C} .logo-figma{background:linear-gradient(135deg,#F24E1E,#A259FF,#1ABCFE)} .logo-opt{background:#00C389}
.app{height:100%;display:flex;flex-direction:column;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.app-nav{flex:0 0 28px;display:flex;align-items:center;gap:7px;padding:0 9px;border-bottom:1px solid var(--line-soft);font-size:10px;color:rgba(255,255,255,.4)}
.app-nav .logo{color:var(--accent);font-weight:700;font-size:10.5px}
.app-nav .search{margin-left:auto;height:15px;min-width:48px;border-radius:4px;background:rgba(255,255,255,.05);font-size:9px;color:rgba(255,255,255,.25);display:flex;align-items:center;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-body{flex:1;min-height:0;overflow:hidden;position:relative}
.sitemap{height:100%;padding:8px 10px;display:flex;flex-direction:column}
.sm-title{font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.35);margin-bottom:6px;font-family:var(--mono)}
.sm-tree{flex:1;display:flex;flex-direction:column;align-items:center}
.sm-node{display:inline-flex;padding:4px 9px;border-radius:5px;font-size:9.5px;font-weight:650;opacity:0;transform:scale(.88);transition:opacity .4s,transform .4s var(--spring)}
.sm-node.on{opacity:1;transform:none}
.sm-node.home{background:#2dd4a8;color:#0a2a22} .sm-node.store{background:#f5a524;color:#2a1a00}
.sm-node.account{background:#3b9eff;color:#041428} .sm-node.blog{background:#f04444;color:#2a0808}
.sm-node.other{background:#9b7bff;color:#160a2a}
.sm-node.leaf{background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.1);font-weight:500;font-size:9px}
.sm-line{width:1px;height:7px;background:rgba(255,255,255,.15);opacity:0;transition:opacity .3s} .sm-line.on{opacity:1}
.sm-row{display:flex;gap:8px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.sm-branch{display:flex;flex-direction:column;align-items:center}
.side-lists{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.side-lists .box{background:rgba(255,255,255,.03);border:1px solid var(--line-soft);border-radius:6px;padding:5px}
.mh{font-size:8px;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.35);margin-bottom:3px;font-family:var(--mono)}
.feat-row,.ev-row{display:flex;align-items:center;gap:5px;font-size:9.5px;color:rgba(255,255,255,.55);padding:2px 0;opacity:0;transform:translateX(-4px);transition:opacity .3s,transform .3s var(--spring)}
.feat-row.on,.ev-row.on{opacity:1;transform:none}
.ic{width:11px;height:11px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:7px}
.ic.click{background:var(--accent-dim);color:var(--accent)} .ic.bolt{background:rgba(255,74,125,.15);color:#FF4A7D}
.shop{height:100%;display:flex;flex-direction:column;background:#111}
.shop-top{flex:0 0 26px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#0a0a0a;border-bottom:1px solid var(--line);font-size:9.5px;color:rgba(255,255,255,.45)}
.shop-top .brand{font-weight:700;color:#fff;font-size:10.5px}
.shop-top .cart{margin-left:auto;padding:2px 7px;border-radius:4px;background:var(--accent-dim);color:var(--accent);font-size:9px}
.shop-hero{padding:10px 12px;display:flex;gap:10px;align-items:center}
.shop-hero h3{margin:0 0 3px;font-size:12px;font-weight:700} .shop-hero p{margin:0;font-size:9.5px;color:rgba(255,255,255,.4)}
.shop-hero .cta{margin-top:5px;padding:5px 10px;border-radius:5px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;border:none;display:inline-block}
.shop-hero .img{width:88px;height:56px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);flex-shrink:0}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px}
.cat-card{background:var(--bg-surface);border:1px solid var(--line);border-radius:7px;padding:7px;font-size:9.5px;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s var(--spring),border-color .25s}
.cat-card.on{opacity:1;transform:none} .cat-card.sel{border-color:rgba(201,162,39,.5);background:var(--accent-dim)}
.cat-card .thumb{height:30px;border-radius:4px;background:rgba(255,255,255,.06);margin-bottom:4px} .cat-card .t{font-weight:650}
.pdp{display:grid;grid-template-columns:1fr 1fr;height:100%}
.pdp-img{background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line-soft)}
.pdp-img .ph{width:68%;height:55%;border-radius:7px;background:rgba(255,255,255,.07)}
.pdp-info{padding:10px;display:flex;flex-direction:column;gap:5px} .pdp-info h3{margin:0;font-size:12px}
.pdp-info .price{font-size:13px;font-weight:700;color:var(--accent)}
.pdp-info .btn{align-self:flex-start;padding:5px 11px;border-radius:5px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;border:none}
.bag{padding:10px;height:100%;display:flex;flex-direction:column}
.bag-row{display:flex;gap:8px;align-items:center;padding:6px;background:var(--bg-surface);border-radius:6px;border:1px solid var(--line);margin-bottom:6px;font-size:10px}
.bag-row .th{width:28px;height:28px;border-radius:4px;background:rgba(255,255,255,.07)}
.bag-cta{margin-top:auto;padding:7px;text-align:center;border-radius:6px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:11px}
.pay-screen{display:grid;grid-template-columns:1.1fr .9fr;height:100%}
.pay-l,.pay-r{padding:9px;overflow:hidden} .pay-r{border-left:1px solid var(--line-soft);background:#12110f}
.pay-l h3,.pay-r h3{margin:0 0 7px;font-size:11px;font-weight:650}
.fld{height:24px;border-radius:5px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.25);margin-bottom:5px;position:relative;transition:border-color .25s,box-shadow .25s}
.fld label{position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:9px;color:rgba(255,255,255,.28)}
.fld.filled label{opacity:0}
.fld.filled::after{content:attr(data-v);position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:10px;color:rgba(255,255,255,.75)}
.fld.bad{border-color:var(--bad);box-shadow:0 0 0 2px rgba(224,133,127,.25)}
.drop-flag{display:inline-flex;gap:4px;align-items:center;margin-top:3px;font-size:9.5px;font-weight:650;color:var(--bad);background:rgba(224,133,127,.12);border:1px solid rgba(224,133,127,.35);padding:3px 7px;border-radius:100px;opacity:0;transition:opacity .35s}
.drop-flag.on{opacity:1}
.sum-line{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.45);margin-bottom:3px}
.sum-total{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.sum-total span:last-child{color:var(--accent)}
.funnel{display:flex;flex-direction:column;justify-content:center;padding:10px 24px;height:100%}
.fstep{display:flex;align-items:center;height:0;margin:0 auto 5px;border-radius:5px;background:rgba(255,255,255,.06);font-size:10px;padding:0 10px;overflow:hidden;opacity:0;transition:height .5s var(--spring),width .55s var(--spring),opacity .35s;width:20%}
.fstep.show{height:24px;opacity:1} .fstep span{margin-left:auto;font-size:9px;color:rgba(255,255,255,.35)}
.fstep.dead{background:rgba(224,133,127,.18);color:#ffb4a8} .fstep.dead span{color:var(--bad)}
.seg{display:grid;grid-template-columns:1fr 1.25fr;height:100%}
.seg-users{padding:8px;border-right:1px solid var(--line-soft);overflow:hidden}
.seg-replay{padding:8px;display:flex;flex-direction:column;min-height:0;gap:5px}
.user-row{display:flex;align-items:center;gap:7px;padding:6px 7px;margin-bottom:4px;border-radius:7px;background:var(--bg-surface);border:1px solid var(--line);font-size:10px;opacity:0;transform:translateX(-5px);transition:opacity .35s,transform .35s var(--spring),border-color .25s,background .25s}
.user-row.on{opacity:1;transform:none} .user-row.sel{border-color:rgba(201,162,39,.45);background:var(--accent-dim)}
.user-row .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#3a2a4a,var(--accent));flex-shrink:0}
.user-row .meta{font-size:8.5px;color:rgba(255,255,255,.4)}
.user-row .badge{margin-left:auto;font-size:8px;padding:2px 5px;border-radius:3px;background:rgba(224,133,127,.15);color:#ffb4a8;font-weight:650}
.replay-player{flex:1;background:#0a0a0a;border:1px solid rgba(255,255,255,.1);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;min-height:0;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s var(--spring)}
.replay-player.on{opacity:1;transform:none}
.rp-chrome{flex:0 0 22px;background:#16151a;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:8.5px;color:rgba(255,255,255,.4);border-bottom:1px solid rgba(255,255,255,.06)}
.rp-chrome .rec{width:6px;height:6px;border-radius:50%;background:#e0524a;animation:pulse 1.2s ease infinite}
@keyframes pulse{50%{opacity:.45}}
.rp-chrome .spd{margin-left:auto;font-size:8px;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.06)}
.rp-screen{flex:1;position:relative;background:#12110f;min-height:0}
.rp-screen .fake-ui{padding:8px;display:flex;flex-direction:column;gap:4px}
.rp-screen .blk{height:7px;border-radius:2px;background:rgba(255,255,255,.06)}

.rp-screen .fld-fake::after{content:'Card number';position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:8px;color:rgba(255,255,255,.25)}
.rp-dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--pendo);box-shadow:0 0 0 3px rgba(255,74,125,.2);left:18%;top:38%;transition:left 1s var(--spring),top 1s var(--spring)}
.rp-rage{position:absolute;border:1.5px solid var(--bad);border-radius:4px;opacity:0;transition:opacity .35s;pointer-events:none}
.rp-rage.on{opacity:1}
.rp-controls{flex:0 0 28px;background:#16151a;display:flex;align-items:center;padding:0 8px;gap:6px;border-top:1px solid rgba(255,255,255,.06)}
.rp-controls .btn{width:16px;height:16px;border-radius:3px;background:rgba(255,255,255,.08);border:none}
.rp-controls .bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.rp-controls .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width 1.1s linear}
.rp-controls .time{font-size:8px;color:rgba(255,255,255,.35);font-family:var(--mono)}
.rp-find{font-size:9px;color:#ffb4a8;padding:4px 8px;background:rgba(224,133,127,.1);border-top:1px solid rgba(224,133,127,.2);display:flex;align-items:center;gap:5px}
.rp-find .tag{font-size:8px;padding:1px 5px;border-radius:3px;background:rgba(224,133,127,.2);font-weight:700}
.res-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:7px;height:100%}
.res-cell{background:var(--bg-surface);border:1px solid var(--line);border-radius:8px;padding:7px;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s var(--spring);overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:3px}
.res-cell.on{opacity:1;transform:none}
.res-cell h4{margin:0;font-size:10px;font-weight:650;color:var(--accent);display:flex;align-items:center;gap:4px}
.quote{font-size:9px;color:rgba(255,255,255,.5);line-height:1.3;border-left:2px solid rgba(201,162,39,.45);padding-left:5px;margin:2px 0;opacity:0;transition:opacity .35s}

.bar-row{display:flex;align-items:center;gap:4px;margin:2px 0;font-size:9px;color:rgba(255,255,255,.45)}

.und{display:grid;grid-template-columns:1fr 1fr;height:100%}
.und-l,.und-r{padding:7px;overflow:hidden} .und-r{border-left:1px solid var(--line-soft)}

.tag{flex-shrink:0;font-size:7.5px;font-weight:700;text-transform:uppercase;padding:2px 4px;border-radius:3px}
.tag-d{background:rgba(162,89,255,.15);color:#c4a0ff} .tag-p{background:var(--accent-dim);color:var(--accent)}
.tag-e{background:rgba(123,167,240,.12);color:var(--u1)} .tag-a{background:rgba(255,74,125,.12);color:#FF4A7D}
.des{display:grid;grid-template-columns:1fr 1fr;height:100%;position:relative}
.des-col{padding:6px;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;gap:4px;min-height:0}
.des-col:last-child{border-right:0}
.des-col h4{margin:0;font-size:10px;font-weight:650;display:flex;align-items:center;gap:4px}
.fig-c{flex:1;background:#1e1e1e;border-radius:5px;border:1px solid rgba(255,255,255,.08);position:relative;min-height:0;overflow:hidden}

.onb-mock{position:absolute;inset:6px;background:var(--bg);border-radius:7px;border:1px solid rgba(143,212,168,.3);display:none;flex-direction:column;z-index:6;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.5);overflow:hidden;align-items:center;text-align:center}
.onb-mock.on{display:flex}
.onb-mock .ico{width:36px;height:36px;border-radius:10px;background:rgba(143,212,168,.12);border:1px solid rgba(143,212,168,.35);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ok);margin-bottom:6px}
.onb-mock h3{margin:0 0 3px;font-size:12px} .onb-mock p{margin:0 0 8px;font-size:9.5px;color:rgba(255,255,255,.45);max-width:220px;line-height:1.3}
.onb-mock .ck{width:100%;max-width:220px;text-align:left}
.onb-mock .ck label{display:flex;align-items:center;gap:6px;padding:5px 6px;margin-bottom:3px;border-radius:5px;background:rgba(255,255,255,.04);border:1px solid var(--line-soft);font-size:9.5px;color:rgba(255,255,255,.6);opacity:0;transform:translateY(3px);transition:opacity .3s,transform .3s var(--spring),border-color .3s}
.onb-mock .ck label.on{opacity:1;transform:none} .onb-mock .ck label.done{border-color:rgba(143,212,168,.4);background:rgba(143,212,168,.08)}
.onb-mock .ck label i{width:12px;height:12px;border-radius:3px;border:1.5px solid rgba(255,255,255,.2);flex-shrink:0}
.onb-mock .ck label.done i{border-color:var(--ok);background:rgba(143,212,168,.25)}
.onb-mock .cta{margin-top:6px;padding:5px 12px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;opacity:0;transition:opacity .35s}
.onb-mock .cta.on{opacity:1}
.deploy-opt{margin-top:4px;font-size:8px;color:rgba(255,255,255,.4);opacity:0;transition:opacity .4s} .deploy-opt.on{opacity:1}
.deploy-opt code{font-family:var(--mono);color:var(--ok)}
.hub{height:100%;display:grid;grid-template-columns:96px 1fr;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.hub-side{background:var(--bg-surface);border-right:1px solid var(--line-soft);padding:8px 5px;font-size:9px;color:rgba(255,255,255,.4)}
.hub-brand{display:flex;align-items:center;gap:5px;color:#f2f0ec;font-weight:700;margin-bottom:7px;padding:0 2px;font-size:9.5px}
.hub-brand i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.hub-side a{display:block;padding:4px 5px;border-radius:4px;margin-bottom:2px;color:inherit;text-decoration:none}
.hub-side a.on{background:var(--accent-dim);color:var(--accent);font-weight:600}
.hub-main{padding:9px;display:flex;flex-direction:column;gap:5px}
.hub-search{height:22px;border-radius:5px;border:1px solid var(--line);background:rgba(0,0,0,.25);display:flex;align-items:center;padding:0 7px;font-size:9px;color:rgba(255,255,255,.35)}
.hub-search em{color:var(--accent);font-style:normal}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.metric{background:var(--bg-surface);border:1px solid var(--line);border-radius:6px;padding:7px;opacity:0;transform:translateY(5px);transition:opacity .35s,transform .35s var(--spring)}
.metric.on{opacity:1;transform:none} .metric .l{font-size:8.5px;color:rgba(255,255,255,.4)} .metric .v{font-size:13px;font-weight:700;color:var(--accent);margin-top:1px}
.sig{display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:5px;background:rgba(255,255,255,.03);border:1px solid var(--line-soft);font-size:9px;color:rgba(255,255,255,.5);opacity:0;transition:opacity .35s}
.sig.on{opacity:1} .sig.hot{background:rgba(224,133,127,.1);border-color:rgba(224,133,127,.3);color:#ffb4a8}
.sig .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)} .sig.hot .dot{background:var(--bad);box-shadow:0 0 0 2px rgba(224,133,127,.2)}
.sig .val{margin-left:auto;font-weight:700}
.note{font-size:11px;color:var(--muted);margin-top:8px}

.wchrome{flex:0 0 28px;display:flex;align-items:center;gap:6px;padding:0 10px;background:linear-gradient(180deg,#2c2826,#1e1c1a);border-bottom:1px solid rgba(201,162,39,.22);font-size:10px;color:rgba(255,255,255,.4)}
.wchrome .dots{display:flex;gap:5px}.wchrome .dots i{width:9px;height:9px;border-radius:50%;display:block}
.wchrome .dots i.r{background:#ff5f57}.wchrome .dots i.y{background:#febc2e}.wchrome .dots i.g{background:#28c840}
.wchrome .title{flex:1;text-align:center;font-size:10px;color:rgba(255,255,255,.48);font-weight:500}

.app,.shop{border:1px solid rgba(201,162,39,.25)!important;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.cat-card,.user-row,.metric,.sig,.prob,.task,.sm-node,.feat-row,.ev-row{transition:opacity .45s,transform .55s var(--spring),border-color .25s,background .25s!important}


/* Figma-style click pulse */
.cursor-pulse{
  position:absolute;z-index:39;pointer-events:none;
  width:10px;height:10px;margin-left:-5px;margin-top:-5px;
  border-radius:50%;border:2px solid rgba(255,255,255,.85);
  opacity:0;transform:scale(.4);
}
.cursor-pulse.fire{
  animation:figmaPulse .45s cubic-bezier(.22,.8,.36,1) forwards;
}
@keyframes figmaPulse{
  0%{opacity:.9;transform:scale(.35);border-width:2px}
  70%{opacity:.35;transform:scale(2.4);border-width:1px}
  100%{opacity:0;transform:scale(3);border-width:0}
}
.cursor.click{transform:scale(.82);transition:transform .1s ease-out}
.tool.show{opacity:1}


/* iOS Safari touch fixes */
.tl button, .controls button, .stage-arrow {
  touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(255,255,255,.12);
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.controls button { min-width: 44px; min-height: 44px; }
.tl button { min-height: 36px; padding: 0 12px; }


/* === MOBILE + SCALE RULES (no page scroll, full UI visible) === */
html, body {
  overflow-x: hidden !important;
  max-width: 100vw !important;
}
.page, .shell, .frame {
  max-width: 100% !important;
  min-width: 0 !important;
  box-sizing: border-box !important;
}
.frame {
  overflow: hidden !important;
  width: 100% !important;
}
.unit {
  /* fixed artboard — never grow page; only transform:scale via fit() */
  flex-shrink: 0 !important;
}
/* compact timeline on narrow */
@media (max-width: 720px) {
  .shell {
    grid-template-columns: 1fr !important;
    gap: 8px !important;
  }
  .tl {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 4px !important;
    max-height: none !important;
    overflow: visible !important;
  }
  .tl button {
    font-size: 10px !important;
    padding: 4px 8px !important;
    min-height: 28px !important;
  }
  .controls {
    gap: 6px !important;
  }
  .controls button {
    min-width: 36px !important;
    min-height: 36px !important;
  }
  .frame {
    height: min(52vh, 380px) !important;
    min-height: 240px !important;
  }
  /* embed: even tighter so modal fits without host scroll */
  html.embed .frame {
    height: min(48vh, 340px) !important;
    min-height: 220px !important;
  }
  html.embed .page {
    padding: 4px !important;
  }
  html.embed, html.embed body {
    overflow: hidden !important;
    height: 100% !important;
  }
}
/* prevent any inner mock from forcing horizontal scroll */
.fab, .wchrome, .meas, .des, .wb, .fab-cat, .paths, .hub-app, .rw-grid {
  max-width: 100% !important;
  min-width: 0 !important;
  box-sizing: border-box !important;
}
.meas-l, .meas-r, .des-col, .wb-form, .wb-sum, .fab-side, .fab-main {
  min-width: 0 !important;
  overflow: hidden !important;
}


/* ── Light mode ── */
html[data-theme="light"] {
  --bg: #f7f5f2;
  --bg-surface: #ffffff;
  --bg-raised: #eeece7;
  --text: #1a1917;
  --muted: #55524c;
  --faint: #726e66;
  --line: rgba(0,0,0,.1);
  --line-soft: rgba(0,0,0,.06);
  --accent: #c45d3a;
  --accent-dim: rgba(196,93,58,.12);
  --on-accent: #fff;
  --ok: #2a9a5c;
  --warn: #b8860b;
  --bad: #c44;
}
html[data-theme="light"], html[data-theme="light"] body {
  background: var(--bg);
  color: var(--text);
}
html[data-theme="light"] .tl button {
  background: var(--bg-surface);
  border-color: var(--line);
  color: var(--muted);
}
html[data-theme="light"] .tl button.on {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--text);
}
html[data-theme="light"] .controls button {
  background: var(--bg-surface);
  border-color: var(--line);
  color: var(--text);
}
html[data-theme="light"] .unit {
  background:
    linear-gradient(rgba(196,93,58,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(196,93,58,.08) 1px, transparent 1px),
    #e8e6e0 !important;
  background-size: 20px 20px, 20px 20px, auto !important;
  border-color: rgba(0,0,0,.1);
}
html[data-theme="light"] .cap {
  background: linear-gradient(to top, rgba(247,245,242,.98), rgba(247,245,242,.88), transparent) !important;
  color: var(--text);
}
html[data-theme="light"] .kicker,
html[data-theme="light"] .lead { color: var(--muted); }
html[data-theme="light"] h1 { color: var(--text); }
html[data-theme="light"] h1 em { color: var(--accent); }
html[data-theme="light"] .prog { background: rgba(0,0,0,.08); }
html[data-theme="light"] .prog i { background: var(--accent); }


/* side arrows on stage (same as EY PI) */
.stage-arrows{position:absolute;inset:0;pointer-events:none;z-index:30}
.stage-arrow{
  pointer-events:auto;position:absolute;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;
  border:1px solid rgba(255,255,255,.12);background:rgba(14,13,12,.55);
  color:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;backdrop-filter:blur(6px);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.stage-arrow:hover{border-color:var(--accent,#c9a227);color:var(--accent,#c9a227)}
.stage-arrow.prev{left:6px}
.stage-arrow.next{right:6px}
.stage-arrow:disabled{opacity:.25;pointer-events:none}
.stage-arrow svg{width:14px;height:14px}
html[data-theme="light"] .stage-arrow{
  background:rgba(255,255,255,.85);border-color:rgba(0,0,0,.12);color:rgba(0,0,0,.55);
}
/* Narrative text — hardcoded white needs explicit dark override in light mode */
html[data-theme="light"] .ts-big{color:var(--text) !important;}
html[data-theme="light"] .ts-big em{text-shadow:none !important;}
html[data-theme="light"] .slide.text{background:rgba(232,230,224,.6) !important;}


/* === CONTAIN UI inside window (skills parity) === */
.frame {
  overflow: hidden !important;
  position: relative !important;
}
.unit {
  overflow: hidden !important;
  width: var(--dw) !important;
  height: var(--dh) !important;
  max-width: var(--dw) !important;
  max-height: var(--dh) !important;
  box-sizing: border-box !important;
}
.win {
  position: absolute !important;
  top: 14px !important;
  left: 16px !important;
  right: 16px !important;
  bottom: var(--cap) !important;
  overflow: hidden !important;
  border-radius: 8px !important;
  max-width: none !important;
}
.win .slide {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;

/* ═══ iPhone / short viewports: full window visible, no scroll ═══ */
html, body {
  overflow-x: hidden;
}
.frame {
  overflow: hidden !important;
  width: 100% !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}
.unit {
  transform-origin: center center !important;
  flex-shrink: 0 !important;
}
/* Mobile: frame takes remaining viewport; page chrome denser */
@media (max-width: 520px), (max-height: 740px) {
  .page {
    padding: 10px 10px 16px !important;
    max-width: 100% !important;
  }
  .kicker { font-size: 10px !important; margin-bottom: 4px !important; }
  h1 { font-size: 18px !important; line-height: 1.2 !important; margin: 0 0 6px !important; }
  .lead { font-size: 12px !important; margin-bottom: 10px !important; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tl {
    gap: 4px !important;
    flex-wrap: wrap !important;
    margin-bottom: 6px !important;
  }
  .tl button {
    font-size: 9px !important;
    padding: 4px 7px !important;
  }
  .controls {
    gap: 6px !important;
    margin-bottom: 6px !important;
  }
  .controls button {
    font-size: 11px !important;
    padding: 6px 10px !important;
  }
  /* Frame = almost all remaining height so unit can scale to fit */
  .frame {
    height: min(420px, calc(100vh - 200px)) !important;
    min-height: 200px !important;
    max-height: calc(100vh - 180px) !important;
  }
}
@media (max-width: 400px), (max-height: 700px) {
  .lead { display: none !important; }
  h1 { font-size: 16px !important; }
  .frame {
    height: min(380px, calc(100vh - 160px)) !important;
    max-height: calc(100vh - 150px) !important;
  }
}




/* ========== Site-aligned light mode (canvas) ==========
   Source: portfolio [data-theme=light] tokens
   --bg #f7f5f2 · --surface #fff · --text #1a1917 · --muted #55524c
   Borders: site rgba(0,0,0,.1) + AA bump .16–.20 on interactive chrome
*/
.unit[data-player-theme="light"],
#demoStage[data-player-theme="light"] {
  --bg: #f7f5f2;
  --bg-surface: #ffffff;
  --bg-raised: #eeece7;
  --bg-elevated: #e4e0d8;
  --text: #1a1917;
  --text-primary: #1a1917;
  --text-secondary: #55524c;
  --text-tertiary: #726e66;
  --muted: #55524c;
  --faint: #726e66;
  --line: rgba(0,0,0,.16);
  --line-soft: rgba(0,0,0,.10);
  --border: rgba(0,0,0,.16);
  --border-soft: rgba(0,0,0,.10);
  --accent-dim: rgba(168,73,40,.12);
  --ok: #1f7a4c;
  --bad: #b42318;
  color: #1a1917 !important;
  background:
    linear-gradient(rgba(0,0,0,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.045) 1px, transparent 1px),
    #f0eeea !important;
  background-size: 22px 22px !important;
  border-color: rgba(0,0,0,.14) !important;
}

/* Typewriter / narrative — never white-on-light */
.unit[data-player-theme="light"] .text-phase,
.unit[data-player-theme="light"] .narrative,
.unit[data-player-theme="light"] .typewriter,
.unit[data-player-theme="light"] #capTxt,
.unit[data-player-theme="light"] .cap,
.unit[data-player-theme="light"] .cap span,
.unit[data-player-theme="light"] .beat-lab,
.unit[data-player-theme="light"] #beatLab,
.unit[data-player-theme="light"] .stage-title {
  color: #1a1917 !important;
  text-shadow: none !important;
  opacity: 1 !important;
}
.unit[data-player-theme="light"] .cap em,
.unit[data-player-theme="light"] .text-phase em,
.unit[data-player-theme="light"] #beatLab .n {
  color: var(--accent) !important;
}

/* Chrome */
.unit[data-player-theme="light"] .stage-chrome {
  background: linear-gradient(to bottom, rgba(247,245,242,.97), rgba(247,245,242,.5), transparent) !important;
  color: #1a1917 !important;
}
.unit[data-player-theme="light"] .stage-chrome .chrome-btns button {
  border: 1.5px solid rgba(0,0,0,.2) !important;
  background: #fff !important;
  color: #1a1917 !important;
}
.unit[data-player-theme="light"] .chrome-prog {
  background: rgba(0,0,0,.14) !important;
}
.unit[data-player-theme="light"] .cap {
  background: linear-gradient(to top, rgba(247,245,242,.97), rgba(247,245,242,.45), transparent) !important;
}

/* Mock shells — site surface + stronger border for AA UI */
.unit[data-player-theme="light"] /* neutralized: do not force dark text on product .app */
.unit[data-player-theme="light"] .wchrome,
.unit[data-player-theme="light"] /* neutralized: app-nav keeps product colors */
.unit[data-player-theme="light"] .wchrome .title { color: #1a1917 !important; }

/* Cards / cells */
.unit[data-player-theme="light"] .res-cell,
.unit[data-player-theme="light"] .metric,
.unit[data-player-theme="light"] .sig,
.unit[data-player-theme="light"] .task,
.unit[data-player-theme="light"] .svc-card,
.unit[data-player-theme="light"] .prob,
.unit[data-player-theme="light"] .prob-card,
.unit[data-player-theme="light"] .chip,
.unit[data-player-theme="light"] .feat {
  background: #fff !important;
  border: 1px solid rgba(0,0,0,.14) !important;
  color: #1a1917 !important;
}
.unit[data-player-theme="light"] .quote {
  color: #2e2b27 !important;
  border-left: 2px solid var(--accent) !important;
  opacity: 1 !important;
}
.unit[data-player-theme="light"] .quote .who { color: #726e66 !important; }
.unit[data-player-theme="light"] .sub,
.unit[data-player-theme="light"] .metric .l,
.unit[data-player-theme="light"] .faint { color: #55524c !important; }
.unit[data-player-theme="light"] .metric .v { color: #1a1917 !important; }

.unit[data-player-theme="light"] .hub-side,
.unit[data-player-theme="light"] /* neutralized: cat-side stays dark product */
.unit[data-player-theme="light"] .hub-side a { color: #55524c !important; }
.unit[data-player-theme="light"] .hub-side a.on {
  color: var(--accent) !important;
  background: var(--accent-dim) !important;
}

.unit[data-player-theme="light"] .bar-row .track,

  background: rgba(0,0,0,.12) !important;
}
.unit[data-player-theme="light"] .bar-row span,
.unit[data-player-theme="light"] .bar-row b { color: #55524c !important; }

.unit[data-player-theme="light"] .replay-screen {

  border: 1px solid rgba(0,0,0,.14) !important;
}
.unit[data-player-theme="light"] .replay-screen .chrome {
  background: #eeece7 !important;
  color: #55524c !important;
}
.unit[data-player-theme="light"] .ui-fake .blk { background: rgba(0,0,0,.08) !important; }

.unit[data-player-theme="light"] .finding {
  color: #9b1c1c !important;

  border-color: rgba(155,28,28,.25) !important;

  color: #55524c !important;
  border: 1px solid rgba(0,0,0,.1);
}
.unit[data-player-theme="light"] .maze-path span.fail {
  color: #9b1c1c !important;
  background: rgba(155,28,28,.08) !important;
}
.unit[data-player-theme="light"] .stage-arrow {
  border: 1.5px solid rgba(0,0,0,.2) !important;

  color: #1a1917 !important;

.unit[data-player-theme="light"] .final-mock {

  border: 1px solid rgba(31,122,76,.3) !important;
  color: #1a1917 !important;
}

  background: #f7f5f2 !important;
  border: 1px solid rgba(0,0,0,.12) !important;
  color: #1a1917 !important;
}
.unit[data-player-theme="light"] .onb h3 { color: #1a1917 !important; }
.unit[data-player-theme="light"] .onb p { color: #55524c !important; }
.unit[data-player-theme="light"] .sig.hot {
  border-color: rgba(155,28,28,.28) !important;
  background: rgba(155,28,28,.06) !important;
}
.unit[data-player-theme="light"] .sig.hot .val { color: #9b1c1c !important; }

/* Cursor on light canvas */
.unit[data-player-theme="light"] .cursor path[fill="#fff"] { fill: #1a1917; }

/* Blockchain stage */
#demoStage[data-player-theme="light"] {
  background: #f0eeea !important;
  border-color: rgba(0,0,0,.14) !important;
}
#demoStage[data-player-theme="light"] .bc-stage-chrome,
#demoStage[data-player-theme="light"] .bc-stage-chrome .title,
#demoStage[data-player-theme="light"] .demo-cap {
  color: #1a1917 !important;
  text-shadow: none !important;
}
#demoStage[data-player-theme="light"] .bc-stage-chrome {
  background: linear-gradient(to bottom, rgba(247,245,242,.97), rgba(247,245,242,.4), transparent) !important;
}
#demoStage[data-player-theme="light"] .bc-stage-chrome .btns button {
  border: 1.5px solid rgba(0,0,0,.2) !important;
  background: #fff !important;

/* ========== SPACE CANON 2026-08-13 (QA whitespace) ==========
   Tokens — use everywhere in the product system
   --max            920px content
   --pad            clamp(16px, 3vw, 28px) horizontal
   --nav-h          64px
   --section-y      clamp(2.25rem, 3vw, 3.25rem) vertical section rhythm
   --stack-xs       6px
   --stack-sm       10px
   --stack-md       14px
   --stack-lg       22px
   --player-chip-gap 12px   chips → stage
   --player-note-gap 10px   stage → caption/note
   --modal-inset     16px–20px around skills modal card
   ============================================================ */
:root{
  --max: 920px !important;
  --pad: clamp(16px, 3vw, 28px) !important;
  --nav-h: 64px !important;
  --section-y: clamp(2.25rem, 3vw, 3.25rem) !important;
  --stack-xs: 6px !important;
  --stack-sm: 10px !important;
  --stack-md: 14px !important;
  --stack-lg: 22px !important;
  --player-chip-gap: 12px !important;
  --player-note-gap: 10px !important;
  --player-rail-gap: 12px !important;
  --modal-inset: 18px !important;
}
.wrap,
.top-nav-inner{
  max-width: var(--max) !important;
  width: 100% !important;
  margin-left: auto !important;
  margin-right: auto !important;
  padding-left: var(--pad) !important;
  padding-right: var(--pad) !important;
  box-sizing: border-box !important;
}
/* Section rhythm — kill 96px/huge asymmetric pads */
.sec,
section.sec,
.section{
  padding-top: var(--section-y) !important;
  padding-bottom: var(--section-y) !important;
  box-sizing: border-box !important;
}
/* First content after fixed nav: don't double-pad absurdly */
.sec:first-of-type,
section.sec:first-of-type,
#hero.sec,
section#hero{
  padding-top: clamp(1.75rem, 2.5vw, 2.5rem) !important;
}
/* Closing / legal: tight, intentional */
.closing,
#closing{
  margin-top: var(--stack-lg) !important;
  margin-bottom: var(--stack-md) !important;
  padding-top: var(--stack-md) !important;
  padding-bottom: var(--stack-md) !important;
}
.legal-note,
.proj-nav{
  margin-top: var(--stack-md) !important;
  padding-top: var(--stack-sm) !important;
}
/* Case players host */
#demo .note,
#pi .note,
#pi p.note,
.bc-player-iframe + .note,
.pi-iframe + .note{
  margin-top: var(--player-note-gap) !important;
  margin-bottom: 0 !important;
}
#pi + .closing,
#demo + .sec,
#process{
  margin-top: 0 !important;
}
/* Eyebrow → title → lede stack */
.eyebrow,
.sec-eyebrow,
.proc-eyebrow,
p.level{
  margin-bottom: var(--stack-sm) !important;
}
h1, .h1, .proc-h, .sec-h{
  margin-top: 0 !important;
}
.lede, .lead, .proc-sub, .sec-sub, .sub{
  margin-top: var(--stack-sm) !important;
  margin-bottom: var(--stack-md) !important;
}
/* Mobile: slightly tighter section, same pad token */
@media (max-width: 720px){
  :root{
    --section-y: clamp(1.75rem, 5vw, 2.5rem) !important;
    --modal-inset: 12px !important;
  }
}

/* Theme: default DARK. Embed follows parent only. Standalone ignores localStorage light. */
(function(){
  function apply(t){
    t = (t === 'light') ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  }
  function isEmbed(){
    return document.documentElement.classList.contains('embed')
      || /(?:^|[?&#])embed=1/.test(location.search + location.hash);
  }
  function read(){
    // 1) Embed → parent theme only (fallback dark)
    if (isEmbed()) {
      try {
        if (window.parent && window.parent !== window) {
          var p = window.parent.document.documentElement.getAttribute('data-theme');
          if (p === 'light' || p === 'dark') { apply(p); return; }
        }
      } catch(e) {}
      apply('dark');
      return;
    }
    // 2) Standalone → dark unless ?theme=light
    var q = new URLSearchParams(location.search).get('theme');
    if (q === 'light') { apply('light'); return; }
    apply('dark');
  }
  // mark embed early
  if (/(?:^|[?&#])embed=1/.test(location.search + location.hash)) {
    document.documentElement.classList.add('embed');
  }
  apply('dark');
  read();
  window.addEventListener('storage', function(e){ if (e.key === 'theme') read(); });
  // parent may toggle theme after load
  setInterval(function(){ if (isEmbed()) read(); }, 1500);
})();
</script>

  /* iOS-safe bind: click + touchend, single fire */
  function bindTap(el, fn){
    if (!el) return;
    var locked = false;
    function run(e){
      if (locked) return;
      locked = true;
      try { fn(e); } finally {
        setTimeout(function(){ locked = false; }, 289);
      }
    }
    el.addEventListener('click', run);
    el.addEventListener('touchend', function(e){
      e.preventDefault();
      run(e);
    }, {passive: false});
  }

  BEATS.forEach(function(b,i){ var btn=document.createElement('button'); btn.type='button'; btn.innerHTML='<span class="n">'+b.n+'</span><span class="nm">'+b.name+'</span>'; if(i===0) btn.className='on'; bindTap(btn, function(){ window.playBeat(i); }); tl.appendChild(btn); });
  
  function typeBeatTitle(n, name){
    var el = document.getElementById('beatLab');
    if(!el) return;
    var full = '<span class="n">'+n+'</span>'+name;
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){
      el.innerHTML = full; return;
    }
    el.innerHTML = '<span class="n">'+n+'</span>';
    var i = 0;
    (function tick(){
      if(i >= name.length){ el.innerHTML = full; return; }
      el.innerHTML = '<span class="n">'+n+'</span>'+ name.slice(0, ++i);
      setTimeout(tick, 22);
    })();
  }

  function sync(){ Array.prototype.forEach.call(tl.children,function(b,i){ b.classList.toggle('on',i===idx); }); prog.style.width=((idx+1)/BEATS.length*100)+'%'; typeBeatTitle(BEATS[idx].n, BEATS[idx].name); var _bp=document.getElementById('btnPrev'); if(_bp)_bp.disabled=idx===0; var _sp=document.getElementById('stagePrev'); if(_sp)_sp.disabled=idx===0; var _bn=document.getElementById('btnNext'); if(_bn)_bn.disabled=idx===BEATS.length-1; var _sn=document.getElementById('stageNext'); if(_sn)_sn.disabled=idx===BEATS.length-1; }
  window.playBeat = function go(i){ gen++; var my=gen; clearAll(); hideCursors(); hideCap(); idx=i; sync(); BEATS[i].fn(function(){ if(my!==gen||!playing) return; after(T.gap, function(){ go(idx<BEATS.length-1?idx+1:0); }); }); }
  bindTap(document.getElementById('play'), function(){ var btn=document.getElementById('play'); playing=!playing; btn.innerHTML=playing?'<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>':'<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'; if(!playing){ clearAll(); } else { window.playBeat(idx); } });
  bindTap(document.getElementById('btnPrev'), function(){ if(idx>0) window.playBeat(idx-1); });
  bindTap(document.getElementById('btnNext'), function(){ if(idx<BEATS.length-1) window.playBeat(idx+1); });
  bindTap(document.getElementById('btnReplay'), function(){ window.playBeat(idx); });
  bindTap(document.getElementById('stagePrev'), function(){ if(idx>0) window.playBeat(idx-1); });
  bindTap(document.getElementById('stageNext'), function(){ if(idx<BEATS.length-1) window.playBeat(idx+1); });
  window.playBeat(0);
})();
</script>

<script>
(function(){
  function startFromHash(){
    var m = (location.hash||'').match(/beat=(\d+)/);
    var n = m ? parseInt(m[1],10) : 0;
    if (isNaN(n) || n < 0) n = 0;
    if (n > 8) n = 8;
    setTimeout(function(){
      if (typeof window.playBeat === 'function') window.playBeat(n);
      else if (typeof go === 'function') go(n);
    }, 129);
  }
  window.addEventListener('message', function(e){
    if (!e.data) return;
    if (e.data.type === 'playBeat' && typeof window.playBeat === 'function') {
      window.playBeat(e.data.index|0);
    }
  });
  if (document.readyState === 'complete') startFromHash();
  else window.addEventListener('load', startFromHash);
})();
</script>




<script>
(function(){
  function fitStages(){
    var tl = document.getElementById('tl');
    if(!tl) return;
    // Always measure with full names visible
    tl.classList.remove('stages-compact');
    // Force layout
    void tl.offsetWidth;
    var rowTop = null, wraps = false;
    var btns = tl.querySelectorAll('button');
    if(!btns.length) return;
    for(var i=0;i<btns.length;i++){
      var r = btns[i].getBoundingClientRect();
      if(rowTop === null) rowTop = Math.round(r.top);
      else if(Math.abs(Math.round(r.top) - rowTop) > 2){ wraps = true; break; }
    }
    // Also if overflow width
    if(tl.scrollWidth > tl.clientWidth + 1) wraps = true;
    if(wraps) tl.classList.add('stages-compact');
  }
  window.addEventListener('resize', function(){
    clearTimeout(window.__fitStagesT);
    window.__fitStagesT = setTimeout(fitStages, 80);
  });
  function boot(){
    fitStages();
    setTimeout(fitStages, 86);
    setTimeout(fitStages, 331);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  // Close: postMessage to parent (modal host) or history.back
  var cx = document.getElementById('closeX');
  if(cx){
    cx.addEventListener('click', function(){
      try {
        if(window.parent && window.parent !== window){
          window.parent.postMessage({ type: 'skills-player-close' }, '*');
        }
      } catch(e) {}
      try { if(window.history.length > 1) history.back(); } catch(e) {}
    });
  }
})();
</script>





















































<script>
/* CLEAN fit v53 — same as Skills: width of column; unit fully visible */
(function(){
  var isEmbed = document.documentElement.classList.contains('embed')
    || /(?:^|[?&#])embed=1\b/.test(location.search+location.hash);
  if(!isEmbed) return;
  document.documentElement.classList.add('embed');

  var NW=560, NH=410, AIR=2;

  function fit(){
    var unit=document.getElementById('unit');
    var frame=document.getElementById('frame');
    var page=document.querySelector('.page');
    if(!unit||!frame) return;

    var fw=frame.getBoundingClientRect().width;
    if(fw<40) fw=(page&&page.clientWidth)||window.innerWidth;

    var s=(fw-AIR*2)/NW;
    if(s>1.12) s=1.12;
    if(s<0.32) s=0.32;

    var visW=NW*s, visH=NH*s;
    frame.style.height=Math.ceil(visH+6)+'px';
    frame.style.minHeight=Math.ceil(visH+6)+'px';
    frame.style.overflow='visible';

    unit.style.left=((fw-visW)/2)+'px';
    unit.style.top='0';
    unit.style.width=NW+'px';
    unit.style.height=NH+'px';
    unit.style.transformOrigin='top left';
    unit.style.transform='scale('+s+')';
    unit.style.position='absolute';

    if(page){
      var pageTop=page.getBoundingClientRect().top;
      var unitBottom=unit.getBoundingClientRect().bottom;
      var fromUnit=Math.ceil(unitBottom-pageTop+20);
      var fromPage=Math.ceil(Math.max(page.scrollHeight||0, page.getBoundingClientRect().height))+12;
      var h=Math.max(fromUnit, fromPage);
      try{
        if(window.parent&&window.parent!==window)
          window.parent.postMessage({type:'skills-player-height', height:h}, '*');
      }catch(e){}
    }
  }

  window.fitUnit=fit;
  var _o=window.fit;
  window.fit=function(){
    if(document.documentElement.classList.contains('embed')) return fit();
    if(typeof _o==='function') return _o.apply(this,arguments);
  };

  function boot(){ fit(); [30,100,250,600,1200,2000].forEach(function(t){setTimeout(fit,t);}); }
  window.addEventListener('resize', function(){ clearTimeout(window.__ey53); window.__ey53=setTimeout(fit,40); });
  document.addEventListener('click', function(){ setTimeout(fit,60); }, true);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
