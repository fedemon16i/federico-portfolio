.art .btn{height:7px;width:40%;margin:6px 5px 0;border-radius:2px;background:rgba(201,162,39,.4)}
.art.a{left:6px;top:20px;width:58px;height:78px} .art.b{left:70px;top:24px;width:58px;height:78px;opacity:.7}
.art.c{left:28px;top:108px;width:58px;height:40px;opacity:.5}
.mcp{flex:1;background:#0d1117;border-radius:5px;padding:5px;font-family:var(--mono);font-size:8px;color:#8b949e;line-height:1.4}
.mcp .ln{opacity:0;transition:opacity .3s} .mcp .ln.on{opacity:1}
.mcp .kw{color:#ff7b72} .mcp .str{color:#a5d6ff}
.merge{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.9);background:var(--accent);color:var(--on-accent);font-size:9px;font-weight:700;padding:5px 9px;border-radius:100px;opacity:0;z-index:5;transition:opacity .35s,transform .4s var(--spring)}
.merge.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.onb-mock{position:absolute;inset:6px;background:var(--bg);border-radius:7px;border:1px solid rgba(143,212,168,.3);display:none;flex-direction:column;z-index:6;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.5);overflow:hidden;align-items:center;text-align:center}
.onb-mock.on{display:flex}
.onb-mock .ico{width:36px;height:36px;border-radius:10px;background:rgba(143,212,168,.12);border:1px solid rgba(143,212,168,.35);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ok);margin-bottom:6px}
.onb-mock h3{margin:0 0 3px;font-size:12px} .onb-mock p{margin:0 0 8px;font-size:9.5px;color:rgba(255,255,255,.45);max-width:220px;line-height:1.3}
.onb-mock .ck{width:100%;max-width:220px;text-align:left}
.onb-mock .ck label{display:flex;align-items:center;gap:6px;padding:5px 6px;margin-bottom:3px;border-radius:5px;background:rgba(255,255,255,.04);border:1px solid var(--line-soft);font-size:9.5px;color:rgba(255,255,255,.6);opacity:0;transform:translateY(3px);transition:opacity .3s,transform .3s var(--spring),border-color .3s}
.onb-mock .ck label.on{opacity:1;transform:none} .onb-mock .ck label.done{border-color:rgba(143,212,168,.4);background:rgba(143,212,168,.08)}
.onb-mock .ck label i{width:12px;height:12px;border-radius:3px;border:1.5px solid rgba(255,255,255,.2);flex-shrink:0}
.onb-mock .ck label.done i{border-color:var(--ok);background:rgba(143,212,168,.25)}
.onb-mock .cta{margin-top:6px;padding:5px 12px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;opacity:0;transition:opacity .35s}
.onb-mock .cta.on{opacity:1}
.deploy-opt{margin-top:4px;font-size:8px;color:rgba(255,255,255,.4);opacity:0;transition:opacity .4s} .deploy-opt.on{opacity:1}
.deploy-opt code{font-family:var(--mono);color:var(--ok)}
.hub{height:100%;display:grid;grid-template-columns:96px 1fr;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.hub-side{background:var(--bg-surface);border-right:1px solid var(--line-soft);padding:8px 5px;font-size:9px;color:rgba(255,255,255,.4)}
.hub-brand{display:flex;align-items:center;gap:5px;color:#f2f0ec;font-weight:700;margin-bottom:7px;padding:0 2px;font-size:9.5px}
.hub-brand i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.hub-side a{display:block;padding:4px 5px;border-radius:4px;margin-bottom:2px;color:inherit;text-decoration:none}
.hub-side a.on{background:var(--accent-dim);color:var(--accent);font-weight:600}
.hub-main{padding:9px;display:flex;flex-direction:column;gap:5px}
.hub-search{height:22px;border-radius:5px;border:1px solid var(--line);background:rgba(0,0,0,.25);display:flex;align-items:center;padding:0 7px;font-size:9px;color:rgba(255,255,255,.35)}
.hub-search em{color:var(--accent);font-style:normal}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.metric{background:var(--bg-surface);border:1px solid var(--line);border-radius:6px;padding:7px;opacity:0;transform:translateY(5px);transition:opacity .35s,transform .35s var(--spring)}
.metric.on{opacity:1;transform:none} .metric .l{font-size:8.5px;color:rgba(255,255,255,.4)} .metric .v{font-size:13px;font-weight:700;color:var(--accent);margin-top:1px}
.sig{display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:5px;background:rgba(255,255,255,.03);border:1px solid var(--line-soft);font-size:9px;color:rgba(255,255,255,.5);opacity:0;transition:opacity .35s}
.sig.on{opacity:1} .sig.hot{background:rgba(224,133,127,.1);border-color:rgba(224,133,127,.3);color:#ffb4a8}
.sig .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)} .sig.hot .dot{background:var(--bad);box-shadow:0 0 0 2px rgba(224,133,127,.2)}
.sig .val{margin-left:auto;font-weight:700}
.note{font-size:11px;color:var(--muted);margin-top:8px}

.wchrome{flex:0 0 28px;display:flex;align-items:center;gap:6px;padding:0 10px;background:linear-gradient(180deg,#2c2826,#1e1c1a);border-bottom:1px solid rgba(201,162,39,.22);font-size:10px;color:rgba(255,255,255,.4)}
.wchrome .dots{display:flex;gap:5px}.wchrome .dots i{width:9px;height:9px;border-radius:50%;display:block}
.wchrome .dots i.r{background:#ff5f57}.wchrome .dots i.y{background:#febc2e}.wchrome .dots i.g{background:#28c840}
.wchrome .title{flex:1;text-align:center;font-size:10px;color:rgba(255,255,255,.48);font-weight:500}
.wchrome .search{height:16px;min-width:56px;border-radius:4px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:9px;color:rgba(255,255,255,.28);display:flex;align-items:center;padding:0 6px}
.app,.shop{border:1px solid rgba(201,162,39,.25)!important;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.cat-card,.user-row,.metric,.sig,.prob,.task,.sm-node,.feat-row,.ev-row{transition:opacity .45s,transform .55s var(--spring),border-color .25s,background .25s!important}


/* Figma-style click pulse */
.cursor-pulse{
  position:absolute;z-index:39;pointer-events:none;
  width:10px;height:10px;margin-left:-5px;margin-top:-5px;
  border-radius:50%;border:2px solid rgba(255,255,255,.85);
  opacity:0;transform:scale(.4);
}
.cursor-pulse.fire{
  animation:figmaPulse .45s cubic-bezier(.22,.8,.36,1) forwards;
}
@keyframes figmaPulse{
  0%{opacity:.9;transform:scale(.35);border-width:2px}
  70%{opacity:.35;transform:scale(2.4);border-width:1px}
  100%{opacity:0;transform:scale(3);border-width:0}
}
.cursor.click{transform:scale(.82);transition:transform .1s ease-out}
.tool.show{opacity:1}


/* iOS Safari touch fixes */
.tl button, .controls button, .stage-arrow {
  touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(255,255,255,.12);
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.controls button { min-width: 44px; min-height: 44px; }
.tl button { min-height: 36px; padding: 0 12px; }


/* embed mode: fill modal, minimal chrome */
html.embed, html.embed body{
  background: transparent !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow: hidden !important;
}
html.embed .page{
  padding: 4px 6px 8px !important;
  max-width: none !important;
  margin: 0 !important;
  background: transparent !important;
}
html.embed .page > .kicker,
html.embed .page > h1,
html.embed .page > .lead,
html.embed .page > p.note{ display: none !important; }
html.embed .shell{
  grid-template-columns: minmax(140px, 180px) 1fr;
  gap: 10px;
}
html.embed .frame{
  height: min(520px, 64vh) !important;
  min-height: 300px !important;
  background: transparent !important;
}
@media(max-width:720px){
  html.embed .shell{ grid-template-columns: 1fr; }
  html.embed .frame{ height: min(400px, 52vh) !important; }
}


/* === MOBILE + SCALE RULES (no page scroll, full UI visible) === */
html, body {
  overflow-x: hidden !important;
  max-width: 100vw !important;
}
.page, .shell, .frame {
  max-width: 100% !important;
  min-width: 0 !important;
  box-sizing: border-box !important;
}
.frame {
  overflow: hidden !important;
  width: 100% !important;
}
.unit {
  /* fixed artboard — never grow page; only transform:scale via fit() */
  flex-shrink: 0 !important;
}
/* compact timeline on narrow */
@media (max-width: 720px) {
  .shell {
    grid-template-columns: 1fr !important;
    gap: 8px !important;
  }
  .tl {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 4px !important;
    max-height: none !important;
    overflow: visible !important;
  }
  .tl button {
    font-size: 10px !important;
    padding: 4px 8px !important;
    min-height: 28px !important;
  }
  .controls {
    gap: 6px !important;
  }
  .controls button {
    min-width: 36px !important;
    min-height: 36px !important;
  }
  .frame {
    height: min(52vh, 380px) !important;
    min-height: 240px !important;
  }
  /* embed: even tighter so modal fits without host scroll */
  html.embed .frame {
    height: min(48vh, 340px) !important;
    min-height: 220px !important;
  }
  html.embed .page {
    padding: 4px !important;
  }
  html.embed, html.embed body {
    overflow: hidden !important;
    height: 100% !important;
  }
}
/* prevent any inner mock from forcing horizontal scroll */
.fab, .wchrome, .meas, .des, .wb, .fab-cat, .paths, .hub-app, .rw-grid {
  max-width: 100% !important;
  min-width: 0 !important;
  box-sizing: border-box !important;
}
.meas-l, .meas-r, .des-col, .wb-form, .wb-sum, .fab-side, .fab-main {
  min-width: 0 !important;
  overflow: hidden !important;
}


/* ── Light mode ── */
html[data-theme="light"] {
  --bg: #f7f5f2;
  --bg-surface: #ffffff;
  --bg-raised: #eeece7;
  --text: #1a1917;
  --muted: #55524c;
  --faint: #726e66;
  --line: rgba(0,0,0,.1);
  --line-soft: rgba(0,0,0,.06);
  --accent: #a6860a;
  --accent-dim: rgba(166,134,10,.12);
  --on-accent: #fff;
  --ok: #2a9a5c;
  --warn: #b8860b;
  --bad: #c44;
}
html[data-theme="light"], html[data-theme="light"] body {
  background: var(--bg);
  color: var(--text);
}
html[data-theme="light"] .tl button {
  background: var(--bg-surface);
  border-color: var(--line);
  color: var(--muted);
}
html[data-theme="light"] .tl button.on {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--text);
}
html[data-theme="light"] .controls button {
  background: var(--bg-surface);
  border-color: var(--line);
  color: var(--text);
}
html[data-theme="light"] .unit {
  background:
    linear-gradient(rgba(196,93,58,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(196,93,58,.08) 1px, transparent 1px),
    #e8e6e0 !important;
  background-size: 20px 20px, 20px 20px, auto !important;
  border-color: rgba(0,0,0,.1);
}
html[data-theme="light"] .cap {
  background: linear-gradient(to top, rgba(247,245,242,.98), rgba(247,245,242,.88), transparent) !important;
  color: var(--text);
}
html[data-theme="light"] .kicker,
html[data-theme="light"] .lead { color: var(--muted); }
html[data-theme="light"] h1 { color: var(--text); }
html[data-theme="light"] h1 em { color: var(--accent); }
html[data-theme="light"] .prog { background: rgba(0,0,0,.08); }
html[data-theme="light"] .prog i { background: var(--accent); }
html.embed, html.embed body,
html.embed[data-theme="light"], html.embed[data-theme="light"] body {
  background: transparent !important;
}
html.embed .page,
html.embed[data-theme="light"] .page {
  background: transparent !important;
}


/* side arrows on stage (same as EY PI) */
.stage-arrows{position:absolute;inset:0;pointer-events:none;z-index:30}
.stage-arrow{
  pointer-events:auto;position:absolute;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;
  border:1px solid rgba(255,255,255,.12);background:rgba(14,13,12,.55);
  color:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;backdrop-filter:blur(6px);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.stage-arrow:hover{border-color:var(--accent,#c9a227);color:var(--accent,#c9a227)}
.stage-arrow.prev{left:6px}
.stage-arrow.next{right:6px}
.stage-arrow:disabled{opacity:.25;pointer-events:none}
.stage-arrow svg{width:14px;height:14px}
html[data-theme="light"] .stage-arrow{
  background:rgba(255,255,255,.85);border-color:rgba(0,0,0,.12);color:rgba(0,0,0,.55);
}


/* === CONTAIN UI inside window (skills parity) === */
.frame {
  overflow: hidden !important;
  position: relative !important;
}
.unit {
  overflow: hidden !important;
  width: var(--dw) !important;
  height: var(--dh) !important;
  max-width: var(--dw) !important;
  max-height: var(--dh) !important;
  box-sizing: border-box !important;
}
.win {
  position: absolute !important;
  top: 14px !important;
  left: 16px !important;
  right: 16px !important;
  bottom: var(--cap) !important;
  overflow: hidden !important;
  border-radius: 8px !important;
  max-width: none !important;
}
.win .slide {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  overflow: hidden !important;
  box-sizing: border-box !important;
}
.win .slide > .fab,
.win .fab {
  height: 100% !important;
  max-height: 100% !important;
  overflow: hidden !important;
  min-height: 0 !important;
}
/* never let mock panels expand past artboard */
.fab-home, .fab-cat, .meas, .des, .wb, .paths, .hub-app, .rw-grid, .funnel-scene, .lab-body, .task-board {
  max-height: 100% !important;
  min-height: 0 !important;
  overflow: hidden !important;
}
.meas-l, .meas-r, .des-col, .wb-form, .wb-sum, .fab-main, .fab-side, .path, .path-body {
  overflow: hidden !important;
  min-width: 0 !important;
  min-height: 0 !important;
}
/* cap text smaller so it never pushes layout */
.cap { font-size: 12px !important; line-height: 1.35 !important; }
/* prevent fit from upscaling past 1 — large elements feel "grown" */

.fab{height:100%;display:flex;flex-direction:column;background:#0a0a0e;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.fab-nav{flex:0 0 32px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:10px;color:rgba(255,255,255,.4)}
.fab-nav .logo{color:#f5d100;font-weight:700;font-size:11px}
.fab-nav .links{display:flex;gap:9px;margin-left:4px}
.fab-nav .search{margin-left:auto;width:70px;height:16px;border-radius:4px;background:rgba(255,255,255,.05);font-size:9px;color:rgba(255,255,255,.25);display:flex;align-items:center;padding:0 6px}
.fab-body{flex:1;min-height:0;overflow:hidden;position:relative}

/* Measure 50/50 */
.meas{display:grid;grid-template-columns:1fr 1fr;height:100%}
.meas-l,.meas-r{padding:10px;overflow:hidden}
.meas-r{border-left:1px solid rgba(255,255,255,.05)}
.mh{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.35);margin-bottom:7px}
.feat{display:flex;align-items:center;gap:7px;padding:5px 7px;margin-bottom:3px;border-radius:5px;font-size:10.5px;color:rgba(255,255,255,.55);opacity:0;transform:translateX(-6px);transition:opacity .4s var(--ease),transform .4s var(--spring),background .25s}
.feat.on{opacity:1;transform:none;background:rgba(255,74,125,.08)}
.feat .dot{width:6px;height:6px;border-radius:50%;background:#333;flex-shrink:0}
.feat.on .dot{background:var(--pendo)}
.rh{font-size:9.5px;color:rgba(255,255,255,.35);margin:7px 0 4px}
.bars{display:flex;align-items:flex-end;gap:4px;height:36px}
.bars i{flex:1;border-radius:2px 2px 0 0;background:linear-gradient(to top,#5c4b00,#f5d100);height:0;transition:height .65s var(--spring)}
.jrow{display:flex;align-items:center;gap:3px;margin-top:5px}
.jrow span{font-size:9px;padding:2px 5px;border-radius:3px;background:rgba(255,255,255,.05);color:rgba(255,255,255,.4);opacity:0;transition:opacity .35s,background .35s}
.jrow span.on{opacity:1;background:rgba(245,209,0,.1);color:#f5d100}
.rtbl{font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.4);margin-top:4px}
.rtbl .rr{display:flex;justify-content:space-between;padding:2px 0;opacity:0;transition:opacity .35s;border-bottom:1px solid rgba(255,255,255,.04)}
.rtbl .rr.on{opacity:1}

/* Home */
.fab-home{height:100%;display:flex;flex-direction:column;justify-content:center;padding:16px 20px;background:radial-gradient(ellipse at 80% 30%,rgba(100,50,200,.26),transparent 55%),#0a0a0e}
.fab-home .k{font-size:9.5px;color:rgba(255,255,255,.35);margin-bottom:5px}
.fab-home .h{font-weight:800;font-size:15px;line-height:1.25;max-width:300px;margin-bottom:5px}
.fab-home .p{font-size:11px;color:rgba(255,255,255,.4);max-width:270px;line-height:1.35}
.fab-cta{align-self:flex-start;margin-top:10px;background:#fff;color:#111;font-size:11px;font-weight:600;padding:7px 12px;border-radius:6px;border:none}
.fab-cta.pulse{animation:hlp .7s ease-out 2}
@keyframes hlp{0%{box-shadow:0 0 0 0 rgba(245,209,0,.45)}100%{box-shadow:0 0 0 10px rgba(245,209,0,0)}}

/* Catalog — richer, cost like EY */
.fab-cat{display:grid;grid-template-columns:108px 1fr;height:100%}
.fab-side{background:#121218;padding:8px 6px;border-right:1px solid rgba(255,255,255,.05);overflow:auto}
.fab-side-h{font-size:9px;font-weight:600;color:rgba(255,255,255,.4);padding:2px 6px 6px}
.fab-side-i{font-size:10px;padding:5px 6px;border-radius:4px;color:rgba(255,255,255,.45);margin-bottom:2px;display:flex;align-items:center;gap:5px}
.fab-side-i.on{background:rgba(245,209,0,.1);color:#f5d100}
.fab-main{padding:10px;overflow:auto}
.fab-main .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fab-main h3{margin:0;font-size:12px;font-weight:650}
.fab-main .filt{font-size:9px;color:rgba(255,255,255,.35);padding:3px 7px;border:1px solid rgba(255,255,255,.08);border-radius:4px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.card{background:#14141c;border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:9px;font-size:10.5px;transition:border-color .25s,background .25s}
.card .ico{width:20px;height:20px;border-radius:5px;background:rgba(245,209,0,.1);margin-bottom:6px;display:flex;align-items:center;justify-content:center;font-size:10px}
.card .t{font-weight:650;margin-bottom:2px}
.card .s{color:rgba(255,255,255,.35);font-size:9.5px;line-height:1.3;margin-bottom:6px}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:rgba(255,255,255,.35)}
.card .cost{color:#f5d100;font-weight:650}
.card .badge{padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.06);font-size:8px}
.card.on{border-color:rgba(245,209,0,.45);background:rgba(245,209,0,.05)}

/* Workbench form detailed */
.wb{display:grid;grid-template-columns:1.12fr .88fr;height:100%}
.wb-form{padding:10px 11px;border-right:1px solid rgba(255,255,255,.05);overflow:auto}
.wb-sum{padding:10px 11px;background:#0e0e14;overflow:auto}
.wb-title{font-size:13px;font-weight:700;margin:0 0 2px}
.wb-sub{font-size:9.5px;color:rgba(255,255,255,.35);margin-bottom:7px}
.steps{display:flex;gap:3px;margin-bottom:9px}
.steps span{flex:1;text-align:center;font-size:8px;padding:4px 1px;border-radius:4px;background:rgba(255,255,255,.04);color:rgba(255,255,255,.35)}
.steps span.on{background:rgba(245,209,0,.12);color:#f5d100;font-weight:600}
.field{position:relative;height:30px;border-radius:5px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.28);margin-bottom:6px;transition:border-color .25s,box-shadow .25s}
.field label{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:10px;color:rgba(255,255,255,.28);transition:opacity .2s}
.field.filled label{opacity:0}
.field.filled::after{content:attr(data-val);position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:10.5px;color:rgba(255,255,255,.78)}
.field.bad{border-color:var(--bad);box-shadow:0 0 0 3px rgba(224,92,74,.22);animation:shake .45s var(--spring)}
@keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
.drop-flag{display:inline-flex;align-items:center;gap:5px;margin-top:4px;font-size:10px;font-weight:650;color:var(--bad);background:rgba(224,92,74,.12);border:1px solid rgba(224,92,74,.35);padding:4px 8px;border-radius:100px;opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s var(--spring)}
.drop-flag.on{opacity:1;transform:none}
.sum-h{font-size:10px;font-weight:650;margin-bottom:7px;color:rgba(255,255,255,.5)}
.sum-row{display:flex;justify-content:space-between;font-size:10px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);color:rgba(255,255,255,.5);opacity:0;transition:opacity .35s}
.sum-row.on{opacity:1}
.sum-row b{color:rgba(255,255,255,.85);font-weight:600}
.sum-row .cost{color:#f5d100}
.sum-total{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;font-size:11px;font-weight:700;opacity:0;transition:opacity .35s}
.sum-total.on{opacity:1}
.sum-total span:last-child{color:#f5d100}

/* Funnel grow — penultimate */
.funnel-wrap{height:100%;display:flex;flex-direction:column;justify-content:center;padding:14px 32px}
.funnel-wrap .fh{font-size:10px;color:rgba(255,255,255,.35);margin-bottom:10px;text-align:center;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.fstep{display:flex;align-items:center;height:0;margin:0 auto 6px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.04);font-size:11px;padding:0 12px;overflow:hidden;opacity:0;transition:height .55s var(--spring),width .6s var(--spring),opacity .4s,background .4s;width:18%}
.fstep.show{height:30px;opacity:1}
.fstep span{margin-left:auto;font-size:10px;color:rgba(255,255,255,.35);font-weight:600}
.fstep.dead{background:rgba(224,92,74,.18);border-color:rgba(224,92,74,.35);color:#ffb4a8}
.fstep.dead span{color:var(--bad)}

/* Research */
.res{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px;height:100%}
.res-tile{background:#121218;border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:9px;font-size:10.5px;opacity:0;transform:translateY(5px);transition:opacity .45s var(--ease),transform .45s var(--spring)}
.res-tile.on{opacity:1;transform:none}
.res-tile h4{margin:0 0 4px;font-size:11px;font-weight:650;color:#f5d100}
.res-tile .find{margin-top:5px;font-size:10px;color:rgba(255,255,255,.55)}

/* Understand — icon problem cards */
.und{display:grid;grid-template-columns:1fr 1fr;height:100%}
.und-l,.und-r{padding:9px;overflow:auto}
.und-r{border-left:1px solid rgba(255,255,255,.05)}
.prob-card{
  display:flex;gap:8px;align-items:flex-start;padding:8px;margin-bottom:6px;border-radius:8px;
  background:rgba(224,92,74,.07);border:1px solid rgba(224,92,74,.2);
  opacity:0;transform:translateY(6px);transition:opacity .4s var(--ease),transform .4s var(--spring);
}
.prob-card.on{opacity:1;transform:none}
.prob-card .ic{
  width:28px;height:28px;border-radius:7px;background:rgba(224,92,74,.15);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  animation:none;
}
.prob-card.on .ic{animation:iconpop .5s var(--spring)}
@keyframes iconpop{0%{transform:scale(.6)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.prob-card .ic svg{width:14px;height:14px;stroke:#ffb4a8;fill:none;stroke-width:1.8}
.prob-card .tx{font-size:10.5px;color:#ffc4bc;line-height:1.35}
.prob-card .tx b{display:block;color:#ffd0c8;font-weight:650;margin-bottom:2px;font-size:11px}
.task{display:flex;gap:7px;align-items:flex-start;padding:8px;margin-bottom:5px;border-radius:7px;background:var(--panel);border:1px solid var(--line);font-size:10.5px;opacity:0;transform:translateX(8px);transition:opacity .4s,transform .4s var(--spring)}
.task.on{opacity:1;transform:none}
.task .tag{flex-shrink:0;font-size:8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 6px;border-radius:4px}
.tag-design{background:rgba(162,89,255,.15);color:#c4a0ff}
.tag-product{background:rgba(245,209,0,.12);color:#f5d100}
.tag-content{background:rgba(61,214,140,.12);color:#3dd68c}
.tag-eng{background:rgba(106,168,255,.12);color:#6aa8ff}
.tag-analytics{background:rgba(255,74,125,.12);color:#FF4A7D}

/* Design Figma | MCP */
.des{display:grid;grid-template-columns:1fr 1fr;height:100%;position:relative}
.des-col{padding:8px;border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;gap:5px;min-height:0}
.des-col:last-child{border-right:0}
.des-col h4{margin:0;font-size:11px;font-weight:650;display:flex;align-items:center;gap:6px}
.des-col .sub{font-size:9px;color:rgba(255,255,255,.35)}
.fig-logo{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,#f24e1e,#a259ff,#1abcfe);flex-shrink:0}
.fig-canvas{flex:1;background:#1e1e1e;border-radius:6px;border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden;min-height:0}
.fig-toolbar{height:22px;background:#2c2c2c;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:4px;padding:0 6px}
.fig-toolbar span{width:14px;height:14px;border-radius:3px;background:rgba(255,255,255,.08)}
.fig-toolbar span.on{background:rgba(162,89,255,.4);outline:1px solid #A259FF}
.art{position:absolute;background:#2a2a2a;border:1px solid rgba(255,255,255,.14);border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.art.a{left:14px;top:30px;width:92px;height:124px}
.art.b{left:116px;top:38px;width:92px;height:124px;opacity:.45}
.art .ln{height:5px;margin:8px 8px 0;border-radius:1px;background:rgba(255,255,255,.1)}
.art .btn{height:10px;width:42%;margin:10px 8px 0;border-radius:2px;background:rgba(245,209,0,.28)}
.mcp{flex:1;background:#0d1117;border-radius:6px;border:1px solid rgba(255,255,255,.08);padding:8px;font-family:var(--mono);font-size:9px;line-height:1.5;color:#8b949e;overflow:hidden;min-height:0}
.mcp .ln{opacity:0;transition:opacity .3s}
.mcp .ln.on{opacity:1}
.mcp .kw{color:#ff7b72}.mcp .str{color:#a5d6ff}.mcp .cm{color:#6e7681}
.merge-pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:#f5d100;color:#111;font-size:10px;font-weight:700;padding:6px 11px;border-radius:100px;opacity:0;z-index:6;transition:opacity .4s,transform .45s var(--spring);pointer-events:none}
.merge-pill.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.final-mock{position:absolute;inset:10px;background:#0a0a0e;border-radius:8px;border:1px solid rgba(255,255,255,.1);display:none;flex-direction:column;z-index:7;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.final-mock.on{display:flex}
.final-mock .fm-nav{height:28px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;padding:0 10px;font-size:10px;color:#f5d100;font-weight:700}
.final-mock .fm-body{flex:1;display:grid;grid-template-columns:1fr 1fr;padding:10px;gap:8px}
.final-mock .fm-panel{background:#121218;border-radius:6px;border:1px solid rgba(255,255,255,.06);padding:8px;font-size:10px}
.final-mock .ck{display:flex;align-items:center;gap:5px;margin-bottom:4px;color:rgba(255,255,255,.55)}
.final-mock .ck i{width:10px;height:10px;border-radius:2px;border:1px solid #f5d100;background:rgba(245,209,0,.2)}

/* Hub skills-like */
.hub{height:100%;display:grid;grid-template-columns:108px 1fr;background:#0a0a0e;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.hub-side{background:#121218;border-right:1px solid rgba(255,255,255,.05);padding:10px 6px;font-size:10px;color:rgba(255,255,255,.4)}
.hub-brand{display:flex;align-items:center;gap:6px;color:#f2f0ec;font-weight:700;margin-bottom:10px;padding:0 4px;font-size:10.5px}
.hub-brand i{width:7px;height:7px;border-radius:50%;background:#f5d100;box-shadow:0 0 0 3px rgba(245,209,0,.15)}
.hub-side a{display:block;padding:5px 6px;border-radius:5px;margin-bottom:2px;color:inherit;text-decoration:none}
.hub-side a.on{background:rgba(245,209,0,.1);color:#f5d100;font-weight:600}
.hub-main{padding:12px;display:flex;flex-direction:column;gap:8px}
.hub-main .ht{font-size:11px;font-weight:650}
.hub-tools{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.metric{background:#121218;border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:10px;opacity:0;transform:translateY(6px);transition:opacity .45s var(--ease),transform .45s var(--spring)}
.metric.on{opacity:1;transform:none}
.metric .l{font-size:9.5px;color:rgba(255,255,255,.4)}
.metric .v{font-size:16px;font-weight:700;color:#f5d100;margin-top:2px;letter-spacing:-.02em}
.note{font-size:12px;color:var(--muted);margin-top:10px}

/* Brand marks — skills-style colored logos */
.logo-mark {
  width: 14px; height: 14px; border-radius: 3px; display: inline-flex;
  align-items: center; justify-content: center; flex-shrink: 0;
  font-size: 7px; font-weight: 800; color: #fff; letter-spacing: -0.02em;
}
.logo-pendo { background: #FF4A7D; }
.logo-figma { background: linear-gradient(135deg, #F24E1E 0%, #FF7262 25%, #A259FF 50%, #1ABCFE 75%, #0ACF83 100%); }
.logo-replit { background: #F26207; }
.logo-factory { background: #111; border: 1px solid #f5d100; color: #f5d100; }
.logo-maze { background: #2A1E5C; }
.logo-optimal { background: #00C389; }
.logo-ga4 { background: #F9AB00; color: #111; }
.logo-paths { background: #7c6af2; }
.chip .logo-mark { width: 13px; height: 13px; font-size: 6.5px; }

/* Research sequential stages */
.res-stage { height: 100%; display: none; flex-direction: column; padding: 10px; }
.res-stage.on { display: flex; }
.res-stage h3 {
  margin: 0 0 8px; font-size: 12px; font-weight: 650;
  display: flex; align-items: center; gap: 8px;
}
.res-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.interview-row {
  display: flex; gap: 8px; align-items: center; padding: 8px;
  background: #121218; border-radius: 8px; border: 1px solid rgba(255,255,255,.06);
  opacity: 0; transform: translateX(-6px); transition: opacity .4s, transform .4s var(--spring);
}
.interview-row.on { opacity: 1; transform: none; }
.interview-row .av {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, #3a2a4a, #FF4A7D); flex-shrink: 0;
}
.interview-row .q { font-size: 10.5px; color: rgba(255,255,255,.55); line-height: 1.35; }
.interview-row .q em { color: #f5d100; font-style: normal; }

.survey-bars { display: flex; flex-direction: column; gap: 8px; }
.survey-row { font-size: 10px; color: rgba(255,255,255,.45); }
.survey-row .lab { display: flex; justify-content: space-between; margin-bottom: 3px; }
.survey-row .track {
  height: 6px; border-radius: 3px; background: rgba(255,255,255,.06); overflow: hidden;
}
.survey-row .track i {
  display: block; height: 100%; width: 0; border-radius: 3px;
  background: #f5d100; transition: width .7s var(--ease);
}

.replay-screen {
  flex: 1; background: #0c0c12; border-radius: 8px; border: 1px solid rgba(255,255,255,.08);
  position: relative; overflow: hidden; min-height: 120px;
}
.replay-screen .chrome {
  height: 22px; background: #16161e; border-bottom: 1px solid rgba(255,255,255,.06);
  display: flex; align-items: center; padding: 0 8px; gap: 4px; font-size: 9px; color: rgba(255,255,255,.35);
}
.replay-screen .chrome span { width: 6px; height: 6px; border-radius: 50%; background: #333; }
.replay-screen .ui-fake {
  padding: 12px; display: flex; flex-direction: column; gap: 6px;
}
.replay-screen .ui-fake .blk {
  height: 10px; border-radius: 3px; background: rgba(255,255,255,.06); width: 70%;
}
.replay-screen .cursor-dot {
  position: absolute; width: 10px; height: 10px; border-radius: 50%;
  background: #FF4A7D; box-shadow: 0 0 0 3px rgba(255,74,125,.25);
  left: 20%; top: 45%; transition: left .9s var(--spring), top .9s var(--spring);
}
.replay-screen .rage {
  position: absolute; border: 1.5px solid #e05c4a; border-radius: 4px;
  opacity: 0; transition: opacity .35s;
}
.replay-screen .finding {
  position: absolute; bottom: 8px; left: 8px; right: 8px;
  font-size: 10px; color: #ffb4a8; background: rgba(224,92,74,.12);
  border: 1px solid rgba(224,92,74,.3); border-radius: 6px; padding: 5px 8px;
  opacity: 0; transition: opacity .4s;
}
.replay-screen .finding.on { opacity: 1; }

.maze-task {
  background: #121218; border: 1px solid rgba(255,255,255,.06); border-radius: 8px;
  padding: 10px; font-size: 11px;
}
.maze-task .pct {
  font-size: 22px; font-weight: 700; color: #f5d100; margin: 6px 0 4px;
  opacity: 0; transform: scale(.9); transition: opacity .4s, transform .45s var(--spring);
}
.maze-task .pct.on { opacity: 1; transform: none; }
.maze-path {
  display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap;
}
.maze-path span {
  font-size: 9px; padding: 3px 6px; border-radius: 4px;
  background: rgba(255,255,255,.05); color: rgba(255,255,255,.4);
  opacity: 0; transition: opacity .3s, background .3s;
}
.maze-path span.on { opacity: 1; }
.maze-path span.fail { background: rgba(224,92,74,.15); color: #ffb4a8; }

.res-nav {
  display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap;
}
.res-nav button {
  height: 24px; padding: 0 8px; border-radius: 100px; font-size: 9.5px;
  border: 1px solid rgba(255,255,255,.1); background: 0; color: rgba(255,255,255,.4); cursor: default;
}
.res-nav button.on { background: rgba(245,209,0,.12); color: #f5d100; border-color: rgba(245,209,0,.3); font-weight: 600; }


/* Caption — skills-like */
.cap {
  font-size: 13px !important;
  letter-spacing: -0.01em;
  min-height: 52px !important;
  padding: 22px 16px 12px !important;
}
.cap #capTxt {
  display: inline;
  transition: opacity .35s var(--ease);
}
.cap.typing #capTxt::after {
  content: '';
  display: inline-block;
  width: 2px; height: 0.9em;
  background: var(--yellow);
  margin-left: 2px;
  vertical-align: -1px;
  animation: blink .8s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* Research 2x2 like measure split */
.res-grid4 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 8px;
  height: 100%;
  padding: 8px;
}
.res-cell {
  background: #121218;
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 9px;
  padding: 9px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-height: 0;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .45s var(--ease), transform .45s var(--spring), border-color .3s;
}
.res-cell.on { opacity: 1; transform: none; }
.res-cell.active { border-color: rgba(245,209,0,.35); }
.res-cell h4 {
  margin: 0;
  font-size: 11px;
  font-weight: 650;
  display: flex;
  align-items: center;
  gap: 6px;
  color: #f5d100;
}
.quote {
  font-size: 10px;
  color: rgba(255,255,255,.5);
  line-height: 1.35;
  padding: 5px 6px;
  border-left: 2px solid rgba(245,209,0,.4);
  margin: 0;
  opacity: 0;
  transition: opacity .4s;
}
.quote.on { opacity: 1; }
.quote .who { display: block; font-size: 9px; color: rgba(255,255,255,.3); margin-top: 3px; font-style: normal; }
.comment {
  font-size: 9.5px;
  color: rgba(255,255,255,.4);
  padding: 4px 6px;
  background: rgba(255,255,255,.04);
  border-radius: 5px;
  opacity: 0;
  transition: opacity .4s;
}
.comment.on { opacity: 1; }
.comment b { color: #f5d100; font-weight: 600; }

/* Improved form in design final */
.final-mock .improve {

  display: flex;
  flex-direction: column;
  padding: 8px 10px;
  gap: 6px;
  overflow: auto;
}

}

  margin-bottom: 5px;

}

  align-items: center;
  gap: 6px;
  margin-bottom: 4px;

.final-mock .prelist label i {

.doc-code {

}
.doc-code .box {
  background: #0d1117; border: 1px solid rgba(255,255,255,.08);
  border-radius: 6px; padding: 6px; font-family: var(--mono);

}
.doc-code .box.on { opacity: 1; }
.doc-code .box .hd { color: #f5d100; margin-bottom: 3px; font-size: 9px; }


.res-cell .split2 {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: 1; min-height: 0;
}
.res-cell .split2 .side { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.res-cell .quote { font-size: 9.5px; max-height: 100%; overflow: hidden; }
.res-cell .survey-row { margin-bottom: 3px; }

/* Design onboarding final */
.onb {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; padding: 12px 16px; gap: 8px;
}
.onb .big-ico {
  width: 48px; height: 48px; border-radius: 14px;
  background: rgba(245,209,0,.12); border: 1px solid rgba(245,209,0,.35);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: #f5d100;
  animation: iconpop .55s var(--spring);
}
.onb h3 { margin: 0; font-size: 14px; font-weight: 700; }
.onb p { margin: 0; font-size: 10.5px; color: rgba(255,255,255,.45); max-width: 240px; line-height: 1.35; }
.onb .checks {
  width: 100%; max-width: 260px; text-align: left; margin-top: 4px;
}
.onb .checks label {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; margin-bottom: 4px; border-radius: 7px;

  font-size: 10.5px; color: rgba(255,255,255,.65);

.onb .checks label i {

  border: 1.5px solid rgba(255,255,255,.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: transparent;
}
.onb .checks label.done i {
  border-color: #3dd68c; background: rgba(61,214,140,.25); color: #3dd68c;
}
.onb .cta {
  margin-top: 6px; background: #f5d100; color: #111;
  font-size: 11px; font-weight: 700; padding: 7px 14px; border-radius: 8px;
  opacity: 0; transition: opacity .4s;
}

/* Theme sync: localStorage + parent page (same-origin iframe) */
(function(){
  function apply(t){
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
  }
  function read(){
    var t = 'dark';
    try {
      var s = localStorage.getItem('theme');
      if (s === 'light' || s === 'dark') t = s;
    } catch(e) {}
    try {
      if (window.parent && window.parent !== window) {
        var p = window.parent.document.documentElement.getAttribute('data-theme');
        if (p === 'light' || p === 'dark') t = p;
      }
    } catch(e) {}
    apply(t);
  }
  read();
  window.addEventListener('storage', function(e){ if (e.key === 'theme') read(); });
  setInterval(read, 1000);
})();
</script>

  function fitContent(){
    try{
      var slide = win.querySelector('.slide.on:not(.text)');
      if(!slide) return;
      var inner = slide.firstElementChild;
      if(!inner) return;
      inner.style.transform = 'none';
      inner.style.transformOrigin = 'top left';
      inner.style.width = '100%';
      inner.style.height = '100%';
      /* measure natural overflow */
      var availW = win.clientWidth || 1;
      var availH = win.clientHeight || 1;
      /* force layout */
      var needW = Math.max(inner.scrollWidth, inner.offsetWidth, 1);
      var needH = Math.max(inner.scrollHeight, inner.offsetHeight, 1);
      var s = Math.min(1, availW / needW, availH / needH);
      if (s < 0.99){
        inner.style.transformOrigin = 'center center';
        inner.style.transform = 'scale(' + s + ')';
        /* keep visual center */
        inner.style.width = (100/s) + '%';
        inner.style.height = (100/s) + '%';
      }
    }catch(e){}
  }

  function mount(html, capMsg){
    win.innerHTML='';
    var s=document.createElement('div');
    s.className='slide on';
    s.innerHTML=html;
    win.appendChild(s);
    if (capMsg) showCap(capMsg);
    requestAnimationFrame(function(){ requestAnimationFrame(fitContent); });
    return s;
  }

                  });
                  return;
                }
                document.getElementById('m'+mi).classList.add('on');
                mi++; after(360, typeM);
              })();
            });
          });
        });
      }
    );
  }

  function beatHub(done){
    textPhase(
      'One <em>Product Analytics Hub</em>.<br>The whole cycle stays visible.',
      chip('Pendo','pendo')+chip('Replit','replit')+chip('Factory','factory'),
      'Hub first — then open Signals.',
      function(){
        /* Phase 1: hub overview */
        mount(
          '<div class="hub"><div class="wchrome"><div class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></div><span class="title">Analytics Hub</span></div><div class="hub-side"><div class="hub-brand"><i></i>Analytics Hub</div>'+
            '<a class="on" href="#" id="navOv">Overview</a><a href="#" id="navSig">Signals</a><a href="#">Funnels</a><a href="#">Guides</a></div>'+
          '<div class="hub-main">'+
            '<div class="ht">Closed-loop health</div>'+
            '<div class="hub-tools">'+chip('Pendo','pendo')+chip('Replit','replit')+chip('Factory','factory')+'</div>'+
            '<div class="metrics">'+
              '<div class="metric" id="hm0"><div class="l">Recovery rate</div><div class="v">+18%</div></div>'+
              '<div class="metric" id="hm1"><div class="l">Time on form</div><div class="v">−24%</div></div>'+
              '<div class="metric" id="hm2"><div class="l">Guide views</div><div class="v">4.2k</div></div>'+
              '<div class="metric" id="hm3"><div class="l">Next bet</div><div class="v" style="font-size:13px">Onboarding</div></div>'+
            '</div></div></div>',
          'Land on the hub — then go to <em>Signals</em>.'
        );
        [0,1,2,3].forEach(function(i){
          after(i*160, function(){ document.getElementById('hm'+i).classList.add('on'); });
        });
        after(900, function(){
          var nav = document.getElementById('navSig');
          curOn(nav, true, function(){
            (function(){var _e=el('navOv'); if(_e)_e.classList.remove('on');})();
            nav.classList.add('on');
            /* Phase 2: Signals */
            after(350, function(){
              mount(
                '<div class="hub"><div class="wchrome"><div class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></div><span class="title">Analytics Hub</span></div><div class="hub-side"><div class="hub-brand"><i></i>Analytics Hub</div>'+
                  '<a href="#">Overview</a><a class="on" href="#">Signals</a><a href="#">Funnels</a><a href="#">Guides</a></div>'+
                '<div class="hub-main">'+
                  '<div class="hub-search">Search <em>Signals</em></div>'+
                  '<div class="ht">Signals · Fabric catalog</div>'+
                  '<div class="hub-signals">'+
                    '<div class="sig hot" id="sg0"><span class="dot"></span><span class="lbl">Funnel drop-off · required service</span><span class="val">−72%</span></div>'+
                    '<div class="sig hot" id="sg1"><span class="dot"></span><span class="lbl">CES effort on workbench</span><span class="val">4.1 ↑</span></div>'+
                    '<div class="sig" id="sg2"><span class="dot"></span><span class="lbl">Catalog → item path</span><span class="val">86% ↑</span></div>'+
                    '<div class="sig" id="sg3"><span class="dot"></span><span class="lbl">Starter kit usage</span><span class="val">+12%</span></div>'+
                  '</div></div></div>',
                'Critical signals in red — up / down at a glance.'
              );
              [0,1,2,3].forEach(function(i){
                after(i*200, function(){ document.getElementById('sg'+i).classList.add('on'); });
              });
              hideCursor();
              after(1600, done);
            });
          });
        });
      }
    );
  }

  
  var BEATS=[
    {n:'01',name:'Measure',fn:beatMeasure},
    {n:'02',name:'Analyze',fn:beatAnalyze},
    {n:'03',name:'Research',fn:beatResearch},
    {n:'04',name:'Understand',fn:beatUnderstand},
    {n:'05',name:'Design',fn:beatDesign},
    {n:'06',name:'Hub',fn:beatHub}
  ];

  
  /* iOS-safe bind: click + touchend, single fire */
  function bindTap(el, fn){
    if (!el) return;
    var locked = false;
    function run(e){
      if (locked) return;
      locked = true;
      try { fn(e); } finally {
        setTimeout(function(){ locked = false; }, 350);
      }
    }
    el.addEventListener('click', run);
    el.addEventListener('touchend', function(e){
      e.preventDefault();
      run(e);
    }, {passive: false});
  }

  var tl=document.getElementById('tl');
  BEATS.forEach(function(b,i){ var btn=document.createElement('button'); btn.type='button'; btn.textContent=b.n+' '+b.name; if(i===0) btn.className='on'; bindTap(btn, function(){ window.playBeat(i); }); tl.appendChild(btn); });
  function sync(){ Array.prototype.forEach.call(tl.children,function(b,i){ b.classList.toggle('on',i===idx); }); prog.style.width=((idx+1)/BEATS.length*100)+'%'; beatLab.textContent=BEATS[idx].n+' '+BEATS[idx].name; document.getElementById('btnPrev').disabled=idx===0; document.getElementById('btnNext').disabled=idx===BEATS.length-1; }
  window.playBeat = function go(i){ gen++; var my=gen; clearAll(); hideCursors(); hideCap(); idx=i; sync(); BEATS[i].fn(function(){ if(my!==gen||!playing) return; after(T.gap, function(){ go(idx<BEATS.length-1?idx+1:0); }); }); }
  bindTap(document.getElementById('play'), function(){ var btn=document.getElementById('play'); playing=!playing; btn.innerHTML=playing?'<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>':'<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'; if(!playing){ clearAll(); } else { window.playBeat(idx); } });
  bindTap(document.getElementById('btnPrev'), function(){ if(idx>0) window.playBeat(idx-1); });
  bindTap(document.getElementById('btnNext'), function(){ if(idx<BEATS.length-1) window.playBeat(idx+1); });
  bindTap(document.getElementById('btnReplay'), function(){ window.playBeat(idx); });
  bindTap(document.getElementById('stagePrev'), function(){ if(idx>0) window.playBeat(idx-1); });
  bindTap(document.getElementById('stageNext'), function(){ if(idx<BEATS.length-1) window.playBeat(idx+1); });
  window.playBeat(0);
})();
</script>

<script>
(function(){
  function startFromHash(){
    var m = (location.hash||'').match(/beat=(\d+)/);
    var n = m ? parseInt(m[1],10) : 0;
    if (isNaN(n) || n < 0) n = 0;
    if (n > 6) n = 6;
    setTimeout(function(){
      if (typeof window.playBeat === 'function') window.playBeat(n);
      else if (typeof go === 'function') go(n);
    }, 180);
  }
  window.addEventListener('message', function(e){
    if (!e.data) return;
    if (e.data.type === 'playBeat' && typeof window.playBeat === 'function') {
      window.playBeat(e.data.index|0);
    }
  });
  if (document.readyState === 'complete') startFromHash();
  else window.addEventListener('load', startFromHash);
})();
</script>
